[package]
name = "umasim"
version = "0.1.0"
edition = "2024"

[features]
default = ["network", "nn"]
network = ["tokio", "axum", "tower-http", "reqwest", "clap"]
nn = ["burn", "chrono", "rand_distr"]

[[bin]]
name = "umasim"
path = "src/main.rs"
required-features = ["network", "nn"]

[[bin]]
name = "generate_training_data"
path = "../unused/bin/generate_training_data.rs"
required-features = ["nn"]

[[bin]]
name = "generate_mean_filtered_data"
path = "../unused/bin/generate_mean_filtered_data.rs"
required-features = ["nn"]

[[bin]]
name = "bench_base"
path = "src/bin/bench_base.rs"

[[bin]]
name = "bench_compositions"
path = "src/bin/bench_compositions.rs"

[[bin]]
name = "ramen_manual"
path = "src/bin/ramen_manual.rs"

[[bin]]
name = "minimal_strategy_ab"
path = "src/bin/minimal_strategy_ab.rs"

[[bin]]
name = "skill_pt_matrix"
path = "src/bin/skill_pt_matrix.rs"

[[bin]]
name = "skill_pt_phase_matrix"
path = "src/bin/skill_pt_phase_matrix.rs"

[dependencies]
anyhow = "1.0.98"
axum = { version = "0.8.4", features = ["ws"], optional = true }
bincode = "2.0.1"
burn = { version = "0.18.0", features = ["std", "ndarray", "train", "autodiff", "wgpu"], optional = true }
chrono = { version = "0.4.41", optional = true }
clap = { version = "4.5.42", features = ["derive"], optional = true }
crossbeam = "0.8.4"
env_logger = "0.11.8"
futures-util = "0.3.31"
indicatif = "0.18.0"
lazy_static = "1.5.0"
log = "0.4.27"
once_cell = "1.21.3"
rand = "0.9.1"
rand_distr = { version = "0.5.1", optional = true }
rand_xoshiro = "0.7.0"
rayon = "1.10.0"
reqwest = { version = "0.12.22", features = ["json"], optional = true }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.142"
strum = "0.27.2"
strum_macros = "0.27.2"
tokio = { version = "1.47.1", features = ["full"], optional = true }
toml = "0.9.5"
tower-http = { version = "0.6.6", features = ["cors", "fs"], optional = true }
