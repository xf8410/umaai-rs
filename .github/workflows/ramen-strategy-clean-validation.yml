name: Clean ramen strategy final validation
on:
  push:
    branches: ['workbench/ramen-strategy-pr-clean']
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ramen-clean-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - name: Compile
        run: cargo check -p umasim
      - name: Ramen tests
        run: cargo test -p umasim --lib ramen
      - name: Paired 1000-game A/B
        shell: bash
        run: |
          set -o pipefail
          cargo run --quiet --release -p umasim --bin minimal_strategy_ab 2>&1 | tee minimal_strategy_ab.txt
      - name: Verify A/B output
        shell: bash
        run: |
          set -euo pipefail
          test "$(grep -c '^run=' minimal_strategy_ab.txt)" -eq 1000
          test "$(grep -c '^RESULT ' minimal_strategy_ab.txt)" -eq 2
          test "$(grep -c '^PAIRED ' minimal_strategy_ab.txt)" -eq 1
          test "$(grep -c '^DELTA ' minimal_strategy_ab.txt)" -eq 1
          test -s logs/A_existing_decisions.csv
          test -s logs/B_local_decisions.csv
          test -s logs/first_divergence.tsv
      - name: Summary
        if: always()
        shell: bash
        run: |
          { echo '## Final clean branch validation'; echo '```text'; grep -E '^(RESULT|PAIRED|DELTA)' minimal_strategy_ab.txt || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-clean-ramen-validation
          path: |
            minimal_strategy_ab.txt
            logs/A_existing_decisions.csv
            logs/B_local_decisions.csv
            logs/first_divergence.tsv
          if-no-files-found: ignore
          retention-days: 14
