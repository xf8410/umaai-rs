name: Ramen dynamic friend outing v28
on:
  push:
    branches: [ramen_workbench, 'workbench/**']
    paths:
      - '.github/workflows/ramen-dynamic-friend-v28.yml'
      - 'crates/umasim/**'
      - 'scripts/ramen/restore_dynamic_friend_outing_v28.py'
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:
permissions: {contents: read}
env:
  SOURCE_SHA: ${{ github.sha }}
  SOURCE_REF: ${{ github.ref }}
  # 本实验显式声明唯一的运行时 patch；未声明的注入一律不允许。
  PATCH_LIST: scripts/ramen/restore_dynamic_friend_outing_v28.py
jobs:
  matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        variant:
          - {name: fixed-135, structure: structall-rpt200-window10-look0-samples1-rawfail-cook240-vrest30-eatguard-friendrest-friend3v45-friendcap135-friendspecial4}
          - {name: dynamic-135, structure: structall-rpt200-window10-look0-samples1-rawfail-cook240-vrest30-eatguard-friendrest-friendcap135-friendspecial4}
        shard: [0, 1, 2]
    env:
      VARIANT: ${{ matrix.variant.name }}
      PT1: 16
      PT2: 64
      PT3: 64
      SAC: 140
      STRUCTURE: ${{ matrix.variant.structure }}
      SHARD: ${{ matrix.shard }}
      RUNS_PER_SHARD: 100
    steps:
      - uses: actions/checkout@v4
        with: {ref: ${{ github.sha }}, fetch-depth: 0}
      - name: Verify immutable source
        run: python3 scripts/verify_experiment_source.py
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply explicitly declared experiment patch（job 内临时应用，不改写任何分支）
        run: python3 scripts/ramen/restore_dynamic_friend_outing_v28.py
      - uses: Swatinem/rust-cache@v2
        with: {shared-key: ramen-dynamic-friend-v28}
      - run: cargo run -p umasim --bin skill_pt_phase_matrix --release --no-default-features
      - uses: actions/upload-artifact@v4
        with: {name: 'v28-${{ matrix.variant.name }}-shard${{ matrix.shard }}', path: matrix-result.csv, retention-days: 14}
  summary:
    needs: matrix
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: ${{ github.sha }}, fetch-depth: 0}
      - name: Verify immutable source
        run: python3 scripts/verify_experiment_source.py
      - uses: actions/download-artifact@v4
        with: {pattern: v28-*, path: matrix-results}
      - name: Generate report
        env: {REPORT_PATH: 'benchmark-results/ramen-dynamic-friend-v28-${{ github.run_id }}.md'}
        run: |
          python3 scripts/summarize_skill_pt_matrix.py
          printf '\nsource_sha=%s\npatch_list=%s\n' "$SOURCE_SHA" "$PATCH_LIST" >> "$REPORT_PATH"
          cat "$REPORT_PATH" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with: {name: ramen-dynamic-friend-v28-report-${{ github.run_id }}, path: benchmark-results/ramen-dynamic-friend-v28-${{ github.run_id }}.md, retention-days: 30}
