name: 捕获结构诊断完整编译错误
on:
  push:
    branches: [workbench/skill-pt-matrix-distill]
    paths: ['.github/workflows/capture-wisdom-diagnostic-error-once.yml']
permissions: {contents: write}
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: workbench/skill-pt-matrix-distill}
      - run: python3 scripts/ramen/add_exact_recommended_weight_override.py
      - uses: dtolnay/rust-toolchain@stable
      - name: 捕获错误
        run: |
          set +e
          cargo check -p umasim --bin wisdom_structure_diagnostic --features experiment-tools --no-default-features > /tmp/compile.txt 2>&1
          code=$?
          cp /tmp/compile.txt .trae/exports/wisdom-structure-diagnostic-compile.txt
          rm .github/workflows/capture-wisdom-diagnostic-error-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m '记录结构诊断编译错误'
          git push origin HEAD:workbench/skill-pt-matrix-distill
          exit 0
