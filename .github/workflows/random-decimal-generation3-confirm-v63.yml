name: 同步上游后小数权重独立复验
on: {workflow_dispatch: {}}
permissions: {contents: read}
concurrency:
  group: post-sync-decimal-confirm-${{ github.ref }}
  cancel-in-progress: true
jobs:
  confirm:
    name: ${{ matrix.build }}｜${{ matrix.candidate }}｜s${{ matrix.seed }}｜p${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        build: ['3速1耐1智','2速2耐1智']
        candidate: [N0,N32,N2,N4,N5,N6,N7,N11,N17,N18,N21,N25,N27,N54,N77]
        seed: [161803,141421]
        shard: [0,1,2]
    env:
      候选编号: ${{ matrix.candidate }}
      BUILD: ${{ matrix.build }}
      基础种子: ${{ matrix.seed }}
      分片序号: ${{ matrix.shard }}
      每分片局数: 100
    steps:
      - uses: actions/checkout@v4
      - name: 固定地区并复原参数
        env: {CID: '${{ matrix.candidate }}'}
        run: |
          if [ "$BUILD" = '3速1耐1智' ]; then echo 'Y3_REGION=11/14/18' >> "$GITHUB_ENV"; else echo 'Y3_REGION=14/18/19' >> "$GITHUB_ENV"; fi
          python3 - <<'PY'
          import os,random
          i=int(os.environ['CID'][1:]);r=random.Random(20260825+i*169087)
          keys=['Y1_PT','Y2_PT','Y3_PT','GAP','OVER','SAC','Y12_WINDOW','Y3_WINDOW','RESERVE','BOND','HINT','CONTINUITY']
          h0=[31.0594,26.2536,4.3471,1.1311,1.3254,234.9200,.1148,.1999,5.2663,5.2657,11.2926,0.0]
          h32=[33.4652,34.1807,7.2000,.9949,1.3621,205.1797,.1955,.1284,27.3883,10.6501,5.4575,0.0]
          scales=[1.8,2.2,1.5,.075,.085,11.,.022,.022,4.,1.4,1.4,0.]
          lo=[20,16,1,.45,.65,150,.03,.04,0,1,1,0];hi=[44,44,16,1.45,1.7,285,.27,.27,42,18,17,0]
          if i==0: vals=h0
          elif i==32: vals=h32
          elif i<32: vals=[x+r.gauss(0,s) for x,s in zip(h0,scales)]
          elif i<64: vals=[x+r.gauss(0,s) for x,s in zip(h32,scales)]
          else:
            a=r.uniform(.15,.85);center=[a*x+(1-a)*y for x,y in zip(h0,h32)];vals=[x+r.gauss(0,s*.75) for x,s in zip(center,scales)]
          vals=[min(h,max(l,v)) for v,l,h in zip(vals,lo,hi)]
          with open(os.environ['GITHUB_ENV'],'a') as f:
            for k,v in zip(keys,vals): f.write(f'{k}={v:.4f}\n')
          PY
      - name: 注入既有小数参数入口
        run: |
          python3 scripts/ramen/add_vital_transition_override.py
          python3 scripts/ramen/add_recipe_continuity_override.py
          python3 scripts/ramen/add_random_decimal_override.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('crates/umasim/Cargo.toml');s=p.read_text();mark='[features]'
          block='''[[bin]]
          name = "random_decimal_matrix"
          path = "tools/data_collection/random_decimal_matrix.rs"
          required-features = ["experiment-tools"]

          '''
          if block not in s:s=s.replace(mark,block+mark)
          p.write_text(s)
          PY
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: {shared-key: post-sync-decimal-confirm}
      - run: cargo run -p umasim --bin random_decimal_matrix --release --features experiment-tools --no-default-features
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.build }}-${{ matrix.candidate }}-s${{ matrix.seed }}-p${{ matrix.shard }}
          path: 随机小数权重矩阵.csv
          retention-days: 30
  summary:
    name: 汇总同步后独立复验18000局
    needs: confirm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: {pattern: '*-N*-s*-p*', path: results}
      - run: |
          python3 - <<'PY' | tee 同步上游后小数权重独立复验报告.md
          import csv,glob,collections,statistics
          g=collections.defaultdict(list);gs=collections.defaultdict(list)
          for p in glob.glob('results/**/随机小数权重矩阵.csv',recursive=True):
            for r in csv.DictReader(open(p)):g[(r['配卡'],r['候选'])].append(r);gs[(r['配卡'],r['候选'],r['基础种子'])].append(r)
          cs=['N0','N32','N2','N4','N5','N6','N7','N11','N17','N18','N21','N25','N27','N54','N77']
          if len(g)!=30 or any(len(v)!=600 for v in g.values()):raise SystemExit({k:len(v) for k,v in g.items()if len(v)!=600})
          def st(rows,key):x=sorted(int(r[key])for r in rows);return statistics.mean(x),x[59],x[0]
          print('# 同步上游地区公式后：小数权重独立复验\n')
          print('- 两套配卡、15候选、两组全新seed、每候选600局，共18,000局')
          for build in ['3速1耐1智','2速2耐1智']:
            base=st(g[(build,'N0')],'总分')[0];out=[]
            for n in cs:
              rows=g[(build,n)];s=st(rows,'总分');pt=st(rows,'技能点');a=statistics.mean(int(r['总分'])for r in gs[(build,n,'161803')]);b=statistics.mean(int(r['总分'])for r in gs[(build,n,'141421')]);out.append((s[0],n,s,pt,a,b,rows[0]))
            print(f'\n## {build}\n\n|候选|均分|相对N0|P10|最低|平均PT|PT P10|种子A|种子B|参数|')
            print('|---|---:|---:|---:|---:|---:|---:|---:|---:|---|')
            for _,n,s,pt,a,b,r in sorted(out,reverse=True):
              prm=f"PT {r['Y1PT']}/{r['Y2PT']}/{r['Y3PT']}；缺口/溢出 {r['缺口']}/{r['溢出']}；让分 {r['让分']}；对盘 {r['前两年对盘']}/{r['第三年对盘']}；预留/羁绊/Hint {r['预留']}/{r['羁绊']}/{r['Hint']}"
              print(f'|{n}|{s[0]:.1f}|{s[0]-base:+.1f}|{s[1]}|{s[2]}|{pt[0]:.1f}|{pt[1]}|{a:.1f}|{b:.1f}|{prm}|')
          print('\n晋级要求：合并均值与两个新seed均领先N0，并综合检查P10和PT。')
          PY
          cat 同步上游后小数权重独立复验报告.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: 同步上游后小数权重独立复验总报告
          path: 同步上游后小数权重独立复验报告.md
          retention-days: 30
