name: 读取修正公式小数权重独立复验报告
on: {workflow_dispatch: {}}
permissions: {actions: read, contents: read}
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: 修正公式小数权重独立复验总报告
          path: report
          github-token: ${{ github.token }}
          repository: xf8410/umaai-rs
          run-id: 32845572442
      - run: cat report/修正公式小数权重独立复验报告.md
