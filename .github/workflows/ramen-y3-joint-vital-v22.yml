name: Ramen Y3 joint pre-post vitality budget v22
on:
  push:
    branches: [workbench/skill-pt-matrix-distill]
    paths: [.github/workflows/ramen-y3-joint-vital-v22.yml]
  workflow_dispatch:
permissions: {contents: write}
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: python3 scripts/y3_joint_vital_budget_v22.py
      - run: cargo fmt -- crates/umasim/src/trainer/local_ramen_trainer.rs
      - run: cargo check -p umasim --bin skill_pt_phase_matrix --no-default-features
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/umasim/src/trainer/local_ramen_trainer.rs
          if git diff --cached --quiet; then echo Already-applied; else
            git commit -m 'fix: jointly price pre and post training vitality before ramen'
            git push origin HEAD:workbench/skill-pt-matrix-distill
          fi
  matrix:
    needs: patch
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix:
        variant:
          - {name: no-budget, structure: structall-rpt200-window10-look0-samples1-rawfail-cook240-vrest30-eatguard-y3pre0-y3post0-y3vw0-y3hard0}
          - {name: soft-30-0-w8, structure: structall-rpt200-window10-look0-samples1-rawfail-cook240-vrest30-eatguard-y3pre30-y3post0-y3vw8-y3hard0}
          - {name: soft-30-10-w8, structure: structall-rpt200-window10-look0-samples1-rawfail-cook240-vrest30-eatguard-y3pre30-y3post10-y3vw8-y3hard0}
          - {name: soft-40-15-w8, structure: structall-rpt200-window10-look0-samples1-rawfail-cook240-vrest30-eatguard-y3pre40-y3post15-y3vw8-y3hard0}
          - {name: soft-30-10-w12, structure: structall-rpt200-window10-look0-samples1-rawfail-cook240-vrest30-eatguard-y3pre30-y3post10-y3vw12-y3hard0}
        shard: [0, 1, 2]
    env:
      VARIANT: ${{ matrix.variant.name }}
      PT1: 16
      PT2: 64
      PT3: 64
      SAC: 140
      STRUCTURE: ${{ matrix.variant.structure }}
      SHARD: ${{ matrix.shard }}
      RUNS_PER_SHARD: 50
    steps:
      - uses: actions/checkout@v4
        with: {ref: workbench/skill-pt-matrix-distill}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: {shared-key: ramen-y3-joint-v22}
      - run: cargo run -p umasim --bin skill_pt_phase_matrix --release --no-default-features
      - uses: actions/upload-artifact@v4
        with: {name: 'v22-${{ matrix.variant.name }}-shard${{ matrix.shard }}', path: matrix-result.csv, retention-days: 14}
  summary:
    needs: matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: workbench/skill-pt-matrix-distill}
      - uses: actions/download-artifact@v4
        with: {pattern: v22-*, path: matrix-results}
      - name: Generate report
        env: {REPORT_PATH: 'benchmark-results/ramen-y3-joint-vital-v22-${{ github.run_id }}.md'}
        run: |
          python3 scripts/summarize_skill_pt_matrix.py
          cat "$REPORT_PATH" >> "$GITHUB_STEP_SUMMARY"
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add benchmark-results/ramen-y3-joint-vital-v22-${{ github.run_id }}.md
          git commit -m 'bench: publish Y3 joint vitality v22'
          git push origin HEAD:workbench/skill-pt-matrix-distill
