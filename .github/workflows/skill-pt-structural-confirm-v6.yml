name: Skill PT structural finalists confirmation v6

on:
  push:
    branches: [workbench/skill-pt-matrix-distill]
    paths: [.github/workflows/skill-pt-structural-confirm-v6.yml]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  prep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check -p umasim --bin skill_pt_phase_matrix --no-default-features
      - run: |
          echo '# v6：v5 结构优胜项大样本复核' >> "$GITHUB_STEP_SUMMARY"
          echo '固定技能 PT 基线 16/64/64、sac140；5 个候选各跑 800 组相同 seed 配对。' >> "$GITHUB_STEP_SUMMARY"

  confirm:
    needs: prep
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        variant:
          - {name: base, structure: ''}
          - {name: vital, structure: vital}
          - {name: reserve20-vital, structure: reserve20-vital}
          - {name: reserve40-vital, structure: reserve40-vital}
          - {name: structall, structure: structall}
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      VARIANT: ptfocus-${{ matrix.variant.name }}
      PT1: 16
      PT2: 64
      PT3: 64
      SAC: 140
      STRUCTURE: ${{ matrix.variant.structure }}
      SHARD: ${{ matrix.shard }}
      RUNS_PER_SHARD: 100
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: skill-pt-matrix
      - run: cargo run -p umasim --bin skill_pt_phase_matrix --release --no-default-features
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v6-${{ env.VARIANT }}-shard${{ matrix.shard }}
          path: matrix-result.csv
          if-no-files-found: error
          retention-days: 7

  summary:
    if: always() && needs.confirm.result == 'success'
    needs: [prep, confirm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workbench/skill-pt-matrix-distill
      - uses: actions/download-artifact@v4
        with:
          pattern: v6-*
          path: matrix-results
      - name: Generate persistent report
        env:
          REPORT_PATH: benchmark-results/skill-pt-structural-confirm-v6-${{ github.run_id }}.md
        run: |
          python3 scripts/summarize_skill_pt_matrix.py
          cat "$REPORT_PATH" >> "$GITHUB_STEP_SUMMARY"
      - name: Commit report
        env:
          REPORT_PATH: benchmark-results/skill-pt-structural-confirm-v6-${{ github.run_id }}.md
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$REPORT_PATH"
          git commit -m "bench: publish structural finalists v6 run ${{ github.run_id }}"
          git push origin HEAD:workbench/skill-pt-matrix-distill
