name: 友人外出实际入库材料价值五维矩阵
on:
  workflow_dispatch:
    inputs:
      friend_scale:
        description: 第一阶段胜出友人训练倍率
        required: true
        default: '1'
permissions: {contents: read}
jobs:
  matrix:
    name: 单价${{ matrix.unit }}｜片${{ matrix.shard }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        unit: ['0','200','400','600','800']
        shard: [0,1,2]
    env:
      FRIEND_TRAIN_SCALE: ${{ inputs.friend_scale }}
      FRIEND_MATERIAL_UNIT: ${{ matrix.unit }}
      RUNS: 100
      GATE_MODE: material-${{ matrix.unit }}
      SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 scripts/ramen/add_vital_transition_override.py
          python3 scripts/ramen/add_recipe_continuity_override.py
          python3 scripts/ramen/add_random_decimal_override.py
          python3 scripts/ramen/add_friend_training_priority_scale.py
          python3 scripts/ramen/add_friend_material_dynamic_value.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('crates/umasim/Cargo.toml');s=p.read_text();mark='[features]'
          block='''[[bin]]
          name = "eat_friend_audit"
          path = "tools/data_collection/eat_friend_audit.rs"
          required-features = ["experiment-tools"]

          '''
          if block not in s:s=s.replace(mark,block+mark)
          p.write_text(s)
          PY
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: {shared-key: friend-material-dynamic}
      - run: |
          export BASE_SEED=$((909090 + SHARD * 1000003))
          cargo run -p umasim --bin eat_friend_audit --release --features experiment-tools --no-default-features
          mv eat-friend-audit.csv "material-$FRIEND_MATERIAL_UNIT-$SHARD.csv"
      - uses: actions/upload-artifact@v4
        with:
          name: 材料-${{ matrix.unit }}-${{ matrix.shard }}
          path: material-${{ matrix.unit }}-${{ matrix.shard }}.csv
          retention-days: 30
  summary:
    needs: matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: {pattern: '材料-*', path: results, merge-multiple: true}
      - run: |
          python3 - <<'PY' | tee 友人外出实际入库材料价值五维报告.md
          import csv,glob,collections,statistics
          rows=[]
          for p in glob.glob('results/*.csv'):rows+=list(csv.DictReader(open(p)))
          g=collections.defaultdict(list)
          for r in rows:g[(r['build'],r['mode'].split('-')[-1])].append(r)
          ks=['speed','stamina','power','guts','wisdom','status_sum','skill_pt','score'];M={}
          print('# 友人外出实际入库万能材料动态价值矩阵\n\n库存上限4；库存3只评价1个，库存4评价0个。\n')
          print('|配卡|材料单价|局数|速|耐|力|根|智|五维和|PT|总分|P10|外出|')
          print('|---|---:|---:|---:|---:|---:|---:|---:|---:|---:|---:|---:|---:|')
          for b in ['3速1耐1智','2速2耐1智']:
            for m in ['0','200','400','600','800']:
              rs=g[(b,m)];v={k:statistics.mean(int(r[k])for r in rs)for k in ks};M[(b,m)]=v;s=sorted(int(r['score'])for r in rs);o=statistics.mean(int(r['friend_outing'])for r in rs)
              print(f"|{b}|{m}|{len(rs)}|{v['speed']:.1f}|{v['stamina']:.1f}|{v['power']:.1f}|{v['guts']:.1f}|{v['wisdom']:.1f}|{v['status_sum']:.1f}|{v['skill_pt']:.1f}|{v['score']:.1f}|{s[len(s)//10-1]}|{o:.2f}|")
          print('\n## 相对材料单价0及晋级\n')
          print('|配卡|单价|Δ速|Δ耐|Δ力|Δ根|Δ智|Δ五维和|ΔPT|Δ总分|三指标全升|五维无单项下降|')
          print('|---|---:|---:|---:|---:|---:|---:|---:|---:|---:|---|---|')
          for b in ['3速1耐1智','2速2耐1智']:
            z=M[(b,'0')]
            for m in ['200','400','600','800']:
              d={k:M[(b,m)][k]-z[k] for k in ks};tri=all(d[k]>0 for k in ['status_sum','skill_pt','score']);five=all(d[k]>=0 for k in ks[:5])
              print(f"|{b}|{m}|{d['speed']:+.1f}|{d['stamina']:+.1f}|{d['power']:+.1f}|{d['guts']:+.1f}|{d['wisdom']:+.1f}|{d['status_sum']:+.1f}|{d['skill_pt']:+.1f}|{d['score']:+.1f}|{'是' if tri else '否'}|{'是' if five else '否'}|")
          PY
          cat 友人外出实际入库材料价值五维报告.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: 友人外出实际入库材料价值五维总报告
          path: 友人外出实际入库材料价值五维报告.md
          retention-days: 30
