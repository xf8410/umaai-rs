name: Skill PT selected-three ramen lookahead v9
on:
  push:
    branches: [workbench/skill-pt-matrix-distill]
    paths: [.github/workflows/skill-pt-ramen-lookahead-v9.yml]
  workflow_dispatch:
permissions:
  contents: write
env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
jobs:
  prep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check -p umasim --bin skill_pt_phase_matrix --no-default-features
      - name: Smoke test generic lookahead tokens
        env:
          VARIANT: smoke-v9
          PT1: 16
          PT2: 64
          PT3: 64
          SAC: 140
          STRUCTURE: structall-rpt200-look10-samples2
          SHARD: 0
          RUNS_PER_SHARD: 0
        run: cargo run -p umasim --bin skill_pt_phase_matrix --no-default-features
  lookahead:
    needs: prep
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        variant:
          # look0 isolates the old static/PT terms; nonzero variants use the new generic
          # pre-decision lookahead over only RamenSelect's selected_regions candidates.
          - {name: look0-s1, structure: structall-rpt200-look0-samples1}
          - {name: look10-s12, structure: structall-rpt200-look10-samples12}
          - {name: look25-s12, structure: structall-rpt200-look25-samples12}
          - {name: look50-s12, structure: structall-rpt200-look50-samples12}
        shard: [0, 1, 2]
    env:
      VARIANT: lookahead-${{ matrix.variant.name }}
      PT1: 16
      PT2: 64
      PT3: 64
      SAC: 140
      STRUCTURE: ${{ matrix.variant.structure }}
      SHARD: ${{ matrix.shard }}
      RUNS_PER_SHARD: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: {shared-key: skill-pt-matrix}
      - run: cargo run -p umasim --bin skill_pt_phase_matrix --release --no-default-features
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v9-${{ env.VARIANT }}-shard${{ matrix.shard }}
          path: matrix-result.csv
          if-no-files-found: error
          retention-days: 7
  summary:
    if: always() && needs.lookahead.result == 'success'
    needs: [prep, lookahead]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: workbench/skill-pt-matrix-distill}
      - uses: actions/download-artifact@v4
        with: {pattern: v9-*, path: matrix-results}
      - name: Generate report
        env: {REPORT_PATH: 'benchmark-results/skill-pt-ramen-lookahead-v9-${{ github.run_id }}.md'}
        run: |
          python3 scripts/summarize_skill_pt_matrix.py
          cat "$REPORT_PATH" >> "$GITHUB_STEP_SUMMARY"
      - name: Commit report
        env: {REPORT_PATH: 'benchmark-results/skill-pt-ramen-lookahead-v9-${{ github.run_id }}.md'}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$REPORT_PATH"
          git commit -m "bench: publish selected-three ramen lookahead v9 run ${{ github.run_id }}"
          git push origin HEAD:workbench/skill-pt-matrix-distill
