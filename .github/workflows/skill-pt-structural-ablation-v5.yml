name: Skill PT prior handwritten logic ablation v5

on:
  push:
    branches: [workbench/skill-pt-matrix-distill]
    paths: [.github/workflows/skill-pt-structural-ablation-v5.yml]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  prep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check -p umasim --bin skill_pt_phase_matrix --no-default-features
      - run: |
          echo '# v5：旧 UmaAi 手写估值结构消融' >> "$GITHUB_STEP_SUMMARY"
          echo '不是继续扩大 PT 数字；测试未来属性预留、动态体力、Hint 随机概率、分层失败期望及其组合。' >> "$GITHUB_STEP_SUMMARY"

  ablation:
    needs: prep
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        variant:
          - {name: base, structure: ''}
          - {name: reserve10, structure: reserve10}
          - {name: reserve20, structure: reserve20}
          - {name: reserve30, structure: reserve30}
          - {name: reserve40, structure: reserve40}
          - {name: reserve60, structure: reserve60}
          - {name: vital, structure: vital}
          - {name: hintprob, structure: hintprob}
          - {name: failmodel, structure: failmodel}
          - {name: reserve20-vital, structure: reserve20-vital}
          - {name: reserve40-vital, structure: reserve40-vital}
          - {name: reserve20-hintprob, structure: reserve20-hintprob}
          - {name: reserve40-hintprob, structure: reserve40-hintprob}
          - {name: vital-hintprob, structure: vital-hintprob}
          - {name: vital-failmodel, structure: vital-failmodel}
          - {name: reserve20-vital-hintprob, structure: reserve20-vital-hintprob}
          - {name: reserve40-vital-hintprob, structure: reserve40-vital-hintprob}
          - {name: structall, structure: structall}
        profile:
          - {name: ptfocus, p1: 16, p2: 64, p3: 64, sac: 140}
          - {name: balanced, p1: 64, p2: 80, p3: 96, sac: 200}
        shard: [0, 1, 2]
    env:
      VARIANT: ${{ matrix.profile.name }}-${{ matrix.variant.name }}
      PT1: ${{ matrix.profile.p1 }}
      PT2: ${{ matrix.profile.p2 }}
      PT3: ${{ matrix.profile.p3 }}
      SAC: ${{ matrix.profile.sac }}
      STRUCTURE: ${{ matrix.variant.structure }}
      SHARD: ${{ matrix.shard }}
      RUNS_PER_SHARD: 50
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: skill-pt-matrix
      - run: cargo run -p umasim --bin skill_pt_phase_matrix --release --no-default-features
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v5-${{ env.VARIANT }}-shard${{ matrix.shard }}
          path: matrix-result.csv
          if-no-files-found: error
          retention-days: 7

  summary:
    if: always()
    needs: [prep, ablation]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workbench/skill-pt-matrix-distill
      - uses: actions/download-artifact@v4
        with:
          pattern: v5-*
          path: matrix-results
      - name: Generate persistent report
        env:
          REPORT_PATH: benchmark-results/skill-pt-structural-v5-${{ github.run_id }}.md
        run: |
          python3 scripts/summarize_skill_pt_matrix.py
          cat "$REPORT_PATH" >> "$GITHUB_STEP_SUMMARY"
      - name: Commit report
        env:
          REPORT_PATH: benchmark-results/skill-pt-structural-v5-${{ github.run_id }}.md
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$REPORT_PATH"
          git commit -m "bench: publish structural handwritten v5 run ${{ github.run_id }}"
          git push origin HEAD:workbench/skill-pt-matrix-distill
