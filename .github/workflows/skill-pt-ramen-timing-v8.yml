name: Skill PT ramen timing and alignment v8
on:
  push:
    branches: [workbench/skill-pt-matrix-distill]
    paths: [.github/workflows/skill-pt-ramen-timing-v8.yml]
  workflow_dispatch:
permissions:
  contents: write
env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
jobs:
  prep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check -p umasim --bin skill_pt_phase_matrix --no-default-features
      - name: Smoke test tokens
        env: {VARIANT: smoke-v8, PT1: 16, PT2: 64, PT3: 64, SAC: 140, STRUCTURE: structall-rpt0-align50, SHARD: 0, RUNS_PER_SHARD: 0}
        run: cargo run -p umasim --bin skill_pt_phase_matrix --no-default-features
  timing:
    needs: prep
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        variant:
          - {name: base, structure: structall}
          - {name: rpt0, structure: structall-rpt0}
          - {name: rpt50, structure: structall-rpt50}
          - {name: rpt100, structure: structall-rpt100}
          - {name: rpt200, structure: structall-rpt200}
          - {name: align10, structure: structall-align10}
          - {name: align25, structure: structall-align25}
          - {name: align50, structure: structall-align50}
          - {name: align100, structure: structall-align100}
          - {name: rpt0-align10, structure: structall-rpt0-align10}
          - {name: rpt0-align25, structure: structall-rpt0-align25}
          - {name: rpt0-align50, structure: structall-rpt0-align50}
          - {name: rpt50-align10, structure: structall-rpt50-align10}
          - {name: rpt50-align25, structure: structall-rpt50-align25}
          - {name: rpt100-align10, structure: structall-rpt100-align10}
          - {name: rpt100-align25, structure: structall-rpt100-align25}
          - {name: rpt200-align10, structure: structall-rpt200-align10}
          - {name: rpt200-align25, structure: structall-rpt200-align25}
        shard: [0, 1, 2]
    env:
      VARIANT: timing-${{ matrix.variant.name }}
      PT1: 16
      PT2: 64
      PT3: 64
      SAC: 140
      STRUCTURE: ${{ matrix.variant.structure }}
      SHARD: ${{ matrix.shard }}
      RUNS_PER_SHARD: 50
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: {shared-key: skill-pt-matrix}
      - run: cargo run -p umasim --bin skill_pt_phase_matrix --release --no-default-features
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v8-${{ env.VARIANT }}-shard${{ matrix.shard }}
          path: matrix-result.csv
          if-no-files-found: error
          retention-days: 7
  summary:
    if: always() && needs.timing.result == 'success'
    needs: [prep, timing]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: workbench/skill-pt-matrix-distill}
      - uses: actions/download-artifact@v4
        with: {pattern: v8-*, path: matrix-results}
      - name: Generate report
        env: {REPORT_PATH: 'benchmark-results/skill-pt-ramen-timing-v8-${{ github.run_id }}.md'}
        run: |
          python3 scripts/summarize_skill_pt_matrix.py
          cat "$REPORT_PATH" >> "$GITHUB_STEP_SUMMARY"
      - name: Commit report
        env: {REPORT_PATH: 'benchmark-results/skill-pt-ramen-timing-v8-${{ github.run_id }}.md'}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$REPORT_PATH"
          git commit -m "bench: publish ramen timing v8 run ${{ github.run_id }}"
          git push origin HEAD:workbench/skill-pt-matrix-distill
