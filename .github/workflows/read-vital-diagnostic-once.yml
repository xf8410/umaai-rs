name: 读取吃后体力转移结构报告
on:
  push:
    branches: [workbench/skill-pt-matrix-distill]
    paths: ['.github/workflows/read-vital-diagnostic-once.yml']
permissions: {actions: read, contents: write}
jobs:
  read:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: workbench/skill-pt-matrix-distill}
      - uses: actions/download-artifact@v4
        with:
          name: 吃后体力转移结构诊断报告
          path: /tmp/report
          repository: xf8410/umaai-rs
          run-id: 32669215289
          github-token: ${{ github.token }}
      - run: |
          cp /tmp/report/吃后体力转移结构诊断报告.md .trae/exports/吃后体力转移结构诊断报告.md
          rm .github/workflows/read-vital-diagnostic-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m '保存吃后体力转移结构摘要'
          git push origin HEAD:workbench/skill-pt-matrix-distill
