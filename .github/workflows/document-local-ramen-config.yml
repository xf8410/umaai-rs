name: Document local ramen policy configuration
on:
  push:
    branches: [workbench/skill-pt-matrix-distill]
    paths: [.github/workflows/document-local-ramen-config.yml]
  workflow_dispatch:
permissions: {contents: write}
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: python3 scripts/document_local_ramen_config.py
      - run: cargo fmt -- crates/umasim/src/trainer/local_ramen_trainer.rs
      - run: cargo check -p umasim --bin skill_pt_phase_matrix --no-default-features
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/umasim/src/trainer/local_ramen_trainer.rs
          git commit -m 'docs: explain every local ramen policy parameter'
          git push origin HEAD:workbench/skill-pt-matrix-distill
