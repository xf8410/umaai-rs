name: Ramen handwritten paired metrics

on:
  workflow_dispatch:
  push:
    branches: [workbench/ramen-mcts-iteration]
    paths:
      - .github/workflows/ramen-handwritten-paired-metrics.yml
      - crates/umasim/src/bin/ramen_metric_compare.rs
      - crates/umasim/src/trainer/local_ramen_trainer.rs
      - crates/umasim/src/trainer/local_ramen_parity.rs
      - crates/umasim/src/trainer/mod.rs

permissions:
  contents: write

jobs:
  paired-metrics:
    name: paired-metrics (${{ matrix.deck }})
    strategy:
      fail-fast: false
      matrix:
        deck: ['2速1耐2智']
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      RUNS: '300'
      DECK_LABEL: ${{ matrix.deck }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workbench/ramen-mcts-iteration
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Run candidate metrics
        env:
          SIDE: candidate
          OUT: candidate-metrics.txt
        run: cargo run -p umasim --bin ramen_metric_compare --release --no-default-features
      - name: Prepare exact upstream baseline checkout
        run: |
          git fetch --no-tags https://github.com/xulai1001/umaai-rs.git \
            ramen_workbench:refs/remotes/upstream/ramen_workbench
          git worktree add --detach /tmp/ramen-baseline a6e1f481ee4c6367b8ae1f876721a8889c4ae586
          cp crates/umasim/src/bin/ramen_metric_compare.rs /tmp/ramen-baseline/crates/umasim/src/bin/ramen_metric_compare.rs
      - name: Run exact baseline metrics
        working-directory: /tmp/ramen-baseline
        env:
          SIDE: baseline
          OUT: ${{ github.workspace }}/baseline-metrics.txt
        run: cargo run -p umasim --bin ramen_metric_compare --release --no-default-features
      - name: Build report and record gate decision
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          def read(path):
              result = {}
              for line in Path(path).read_text().splitlines():
                  key, _, value = line.partition('=')
                  result[key] = value.strip()
              return result

          def num(row, key):
              return float(row[key])

          base = read('baseline-metrics.txt')
          cand = read('candidate-metrics.txt')
          deck = os.environ['DECK_LABEL']
          keys = [
              ('score_mean', '总分'),
              ('attribute_score_mean', '属性评分'),
              ('skill_pt_mean', '技能PT'),
          ]
          lines = ['# Ramen handwritten paired metrics', '',
                   f'配卡：{deck}，基线：上游 ramen_workbench @ a6e1f48，'
                   f"配对局数 {int(num(base, 'runs'))}",
                   '', '|指标|基线均值|候选均值|变化|结论|', '|---|---:|---:|---:|---|']
          ok = True
          for key, label in keys:
              delta = num(cand, key) - num(base, key)
              passed = delta > 0
              ok = ok and passed
              verdict = '提升' if passed else '未提升'
              lines.append(f'|{label}|{num(base, key):.3f}|{cand[key]:.3f}|{delta:+.3f}|{verdict}|')
          lines.append('')
          conclusion = '三项全部严格提升，通过' if ok else '存在未提升指标，失败'
          lines.append(f'**整体结论：{conclusion}**')
          Path('paired-metrics-report.md').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          Path('.gate-result').write_text('pass' if ok else 'fail', encoding='utf-8')
          print('\n'.join(lines))
          PY
          cat paired-metrics-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Publish report to workbench branch
        if: always() && hashFiles('paired-metrics-report.md') != ''
        run: |
          mkdir -p benchmark-results
          cp paired-metrics-report.md benchmark-results/paired-metrics-report-latest.md
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f benchmark-results/paired-metrics-report-latest.md
          git diff --cached --quiet || git commit -m "bench: publish paired metrics report run ${{ github.run_id }}"
          git push origin HEAD:workbench/ramen-mcts-iteration
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('paired-metrics-report.md') != ''
        with:
          name: ramen-handwritten-paired-metrics-${{ matrix.deck }}-${{ github.run_id }}
          path: |
            baseline-metrics.txt
            candidate-metrics.txt
            paired-metrics-report.md
          retention-days: 30
      - name: Enforce strict improvement gate
        run: |
          if [ "$(cat .gate-result)" != "pass" ]; then
            echo "Gate failed: 指标未全部提升，报告见仓库 benchmark-results/paired-metrics-report-latest.md"
            exit 1
          fi
