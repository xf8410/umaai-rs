name: Ramen handwritten paired metrics

on:
  workflow_dispatch:
  push:
    branches: [workbench/ramen-mcts-iteration]
    paths:
      - .github/workflows/ramen-handwritten-paired-metrics.yml
      - crates/umasim/src/bin/ramen_metric_compare.rs
      - crates/umasim/src/trainer/local_ramen_trainer.rs

permissions:
  contents: read

jobs:
  paired-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      RUNS: '300'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workbench/ramen-mcts-iteration
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Build candidate metric runner
        run: cargo check -p umasim --bin ramen_metric_compare --release --no-default-features
      - name: Run candidate metrics
        env:
          SIDE: candidate
          OUT: candidate-metrics.txt
        run: cargo run -p umasim --bin ramen_metric_compare --release --no-default-features
      - name: Prepare exact upstream baseline checkout
        run: |
          git fetch --no-tags https://github.com/xulai1001/umaai-rs.git \
            ramen_workbench:refs/remotes/upstream/ramen_workbench
          git worktree add --detach /tmp/ramen-baseline a6e1f481ee4c6367b8ae1f876721a8889c4ae586
          cp crates/umasim/src/bin/ramen_metric_compare.rs /tmp/ramen-baseline/crates/umasim/src/bin/ramen_metric_compare.rs
      - name: Build baseline metric runner
        working-directory: /tmp/ramen-baseline
        run: cargo check -p umasim --bin ramen_metric_compare --release --no-default-features
      - name: Run exact baseline metrics
        working-directory: /tmp/ramen-baseline
        env:
          SIDE: baseline
          OUT: ${{ github.workspace }}/baseline-metrics.txt
        run: cargo run -p umasim --bin ramen_metric_compare --release --no-default-features
      - name: Require score, attribute score, and skill PT all to improve
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def read(path):
              result = {}
              for line in Path(path).read_text().splitlines():
                  key, value = line.split('=', 1)
                  result[key] = float(value)
              return result

          base = read('baseline-metrics.txt')
          cand = read('candidate-metrics.txt')
          keys = ['score_mean', 'attribute_score_mean', 'skill_pt_mean']
          print('baseline:', {key: base[key] for key in keys})
          print('candidate:', {key: cand[key] for key in keys})
          failed = [key for key in keys if not cand[key] > base[key]]
          if failed:
              raise SystemExit('candidate did not strictly improve: ' + ', '.join(failed))
          report = '# Ramen handwritten paired metrics\n\n' + ''.join(
              f'- {key}: {base[key]:.3f} -> {cand[key]:.3f} ({cand[key] - base[key]:+.3f})\n'
              for key in keys
          )
          Path('paired-metrics-report.md').write_text(report, encoding='utf-8')
          print('PASS: score, attribute score, and skill PT all strictly improved')
          PY
          cat paired-metrics-report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: ramen-handwritten-paired-metrics-${{ github.run_id }}
          path: |
            baseline-metrics.txt
            candidate-metrics.txt
            paired-metrics-report.md
          retention-days: 30
