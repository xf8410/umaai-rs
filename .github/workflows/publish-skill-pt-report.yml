name: Publish completed skill PT matrix report

on:
  push:
    branches: [workbench/skill-pt-matrix-distill]
    paths: [.github/workflows/publish-skill-pt-report.yml]
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workbench/skill-pt-matrix-distill
      - name: Download aggregated results from completed run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p matrix-results benchmark-results
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/9480254377/zip" > result.zip
          unzip -q result.zip -d matrix-results
      - name: Generate readable Markdown report
        env:
          GITHUB_STEP_SUMMARY: benchmark-results/skill-pt-matrix-run-32590349220.md
        run: python3 scripts/summarize_skill_pt_matrix.py
      - name: Show report in this run Summary
        run: cat benchmark-results/skill-pt-matrix-run-32590349220.md >> "$GITHUB_STEP_SUMMARY"
      - name: Commit report to experiment branch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add benchmark-results/skill-pt-matrix-run-32590349220.md
          git commit -m "bench: publish skill PT matrix run 32590349220 report"
          git push origin HEAD:workbench/skill-pt-matrix-distill
