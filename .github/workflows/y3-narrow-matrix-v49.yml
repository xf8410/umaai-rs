name: 3速1耐1智第三年窄邻域
on:
  push:
    branches: [workbench/skill-pt-matrix-distill]
    paths: ['.github/workflows/y3-narrow-matrix-v49.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  matrix:
    name: ${{ matrix.variant }}｜第${{ matrix.shard.human }}片
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        variant: [对盘08, 对盘10, 对盘11, 对盘12, 对盘13, 对盘14, 对盘15, PT28对盘12, PT30对盘12]
        shard:
          - {index: 0, human: 1}
          - {index: 1, human: 2}
          - {index: 2, human: 3}
    env:
      候选方案: ${{ matrix.variant }}
      分片序号: ${{ matrix.shard.index }}
      每分片局数: 100
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/ramen/add_exact_recommended_weight_override.py
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: {shared-key: 第三年窄邻域}
      - run: cargo run -p umasim --bin y3_narrow_matrix --release --features experiment-tools --no-default-features
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.variant }}-第${{ matrix.shard.human }}片
          path: 第三年窄邻域.csv
          retention-days: 30
  summary:
    name: 汇总第三年窄邻域
    needs: matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: {pattern: '*-第*片', path: results}
      - run: |
          python3 - <<'PY' | tee 第三年窄邻域报告.md
          import csv,glob,collections,statistics
          g=collections.defaultdict(list)
          for p in glob.glob('results/**/第三年窄邻域.csv',recursive=True):
            for r in csv.DictReader(open(p)): g[r['方案']].append(r)
          expected={'对盘08','对盘10','对盘11','对盘12','对盘13','对盘14','对盘15','PT28对盘12','PT30对盘12'}
          if set(g)!=expected or any(len(x)!=300 for x in g.values()): raise SystemExit({k:len(v) for k,v in g.items()})
          def st(rows,key):
            x=sorted(float(r[key]) for r in rows); return statistics.mean(x),x[29],x[0]
          print('# 第三年对盘与PT窄邻域\n')
          print('|方案|平均总分|总分P10|最低总分|平均PT|PT P10|最低PT|')
          print('|---|---:|---:|---:|---:|---:|---:|')
          out=[]
          for name,rows in g.items():
            s=st(rows,'总分'); p=st(rows,'技能点'); out.append((s[0],p[0],name,s,p))
          for _,_,name,s,p in sorted(out,reverse=True):
            print(f'|{name}|{s[0]:.1f}|{s[1]:.0f}|{s[2]:.0f}|{p[0]:.1f}|{p[1]:.0f}|{p[2]:.0f}|')
          print('\n下一步只让均值领先且P10不过度退化的前两名进入独立种子确认。')
          PY
          cat 第三年窄邻域报告.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: 第三年窄邻域报告
          path: 第三年窄邻域报告.md
          retention-days: 30
