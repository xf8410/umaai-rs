name: Ramen neural dimension training matrix v32
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4]
    env:
      COUNT: 150
      ROLLOUTS: 32
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workbench/skill-pt-matrix-distill
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ramen-neural-v32
      - run: cargo fmt --all -- --check
      - name: Generate teacher labels
        run: START=$((1000 + ${{ matrix.shard }} * 150)) cargo run -p umasim --bin ramen_feature_dataset --release --no-default-features
      - uses: actions/upload-artifact@v4
        with:
          name: ramen-neural-v32-${{ matrix.shard }}
          path: ramen-feature-dataset.jsonl
  train:
    needs: data
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workbench/skill-pt-matrix-distill
      - uses: actions/download-artifact@v4
        with:
          pattern: ramen-neural-v32-*
          path: data
      - run: python3 -m pip install --user numpy
      - run: mkdir -p benchmark-results && python3 scripts/train_ramen_dimension_matrix_v32.py > benchmark-results/ramen-neural-dimension-training-v32.md
      - run: cat benchmark-results/ramen-neural-dimension-training-v32.md
      - name: Commit report
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add benchmark-results/ramen-neural-dimension-training-v32.md
          git commit -m 'bench: publish trained neural dimension matrix v32'
          git pull --rebase origin workbench/skill-pt-matrix-distill
          git push origin HEAD:workbench/skill-pt-matrix-distill
