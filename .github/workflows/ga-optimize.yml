name: GA optimize

on:
  workflow_dispatch:
    inputs:
      uma:
        description: '育成马娘 gameId（102601=美浦波旁 / 111101=空中救世主），传 random=从umaDB随机抽一骑'
        required: true
        default: '102601'
      exclude_chara:
        description: '手动排除的 chara_id，空格分隔（救世主轮传 1026=波旁5张；育成马娘本体卡自动剔除无需填）'
        required: false
        default: ''
      pop:
        description: '种群大小'
        required: false
        default: '50'
      gens:
        description: '代数'
        required: false
        default: '100'
      tag:
        description: '产物 artifact 标签（如 v6-bourbon）'
        required: false
        default: 'ga_run'
      random_cards:
        description: '随机配卡（true=随机普通卡分布+随机友人，本体卡自动避让）'
        required: false
        default: 'false'
      loop_minutes:
        description: '循环分钟数（0=单轮；>0 时循环随机马+随机卡跑到时限）'
        required: false
        default: '0'

jobs:
  ga:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build once
        run: cargo build --release --bin ga_optimize

      - name: Run GA optimizer
        run: |
          EXCLUDE_ARGS=""
          if [ -n "${{ github.event.inputs.exclude_chara }}" ]; then
            for c in ${{ github.event.inputs.exclude_chara }}; do
              EXCLUDE_ARGS="$EXCLUDE_ARGS --exclude-chara $c"
            done
          fi
          if [ "${{ github.event.inputs.uma }}" = "random" ]; then
            UMA_ARGS="--random-uma"
          else
            UMA_ARGS="--uma ${{ github.event.inputs.uma }}"
          fi
          if [ "${{ github.event.inputs.random_cards }}" = "true" ]; then
            CARDS_ARGS="--random-cards"
          else
            CARDS_ARGS=""
          fi
          echo "GA run: uma=${{ github.event.inputs.uma }} random_cards=${{ github.event.inputs.random_cards }} loop=${{ github.event.inputs.loop_minutes }}min pop=${{ github.event.inputs.pop }} gens=${{ github.event.inputs.gens }} exclude=[${{ github.event.inputs.exclude_chara }}]"
          LOOP_MIN=${{ github.event.inputs.loop_minutes }}
          END=$((SECONDS + LOOP_MIN * 60))
          i=0
          while [ $SECONDS -lt $END ]; do
            i=$((i+1))
            echo "===== 循环第 $i 轮（已跑 $((SECONDS/60)) 分钟）====="
            ./target/release/ga_optimize \
              $UMA_ARGS $CARDS_ARGS $EXCLUDE_ARGS \
              --pop ${{ github.event.inputs.pop }} \
              --gens ${{ github.event.inputs.gens }} \
              --out ga_logs/run_$i || echo "[warn] 第 $i 轮失败，继续下一轮"
          done
          echo "循环结束：共 $i 轮"

      - name: Upload GA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ga-${{ github.event.inputs.tag }}
          path: ga_logs/
          retention-days: 90
