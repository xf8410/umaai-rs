name: Cleanup one-shot ramen fix tooling

on:
  push:
    branches: [workbench/ramen-mcts-iteration]
    paths: [.github/workflows/apply-ramen-handwritten-fix.yml]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workbench/ramen-mcts-iteration
          fetch-depth: 0
      - name: Remove one-shot patch tooling
        run: |
          git rm .github/workflows/apply-ramen-handwritten-fix.yml
          git rm scripts/apply_ramen_handwritten_fix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: remove one-shot handwritten fix tooling"
          git push origin HEAD:workbench/ramen-mcts-iteration
