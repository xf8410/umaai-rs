name: 单种配卡×120拉面地区排列组合

on:
  push:
    branches:
      - workbench/101x120-upstream-ramen-v2
    paths:
      - '.github/ramen-composition-index'

permissions:
  contents: read

concurrency:
  group: composition-y3-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  matrix:
    name: 配卡分片${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: [0, 1]
    env:
      RUNS: 1
    steps:
      - uses: actions/checkout@v4
      - name: Read composition index
        shell: bash
        run: |
          index="$(tr -d '[:space:]' < .github/ramen-composition-index)"
          if ! [[ "$index" =~ ^([0-9]|[1-9][0-9]|100)$ ]]; then
            echo "配卡编号无效: $index（必须为0到100）" >&2
            exit 1
          fi
          echo "COMPOSITION_INDEX=$index" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: composition-y3-upstream-ramen
      - name: Run 60 region combinations
        shell: bash
        run: |
          start=$(( ${{ matrix.shard }} * 60 ))
          end=$(( start + 60 ))
          COMBO_START="$start" COMBO_END="$end" \
            cargo run -p umasim --bin composition_y3_matrix --release --no-default-features
      - uses: actions/upload-artifact@v4
        with:
          name: 配卡结果-分片${{ matrix.shard }}
          path: composition-y3-matrix.csv
          retention-days: 30

  summary:
    name: 汇总单种配卡120组合
    if: always()
    needs: matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read composition index
        shell: bash
        run: |
          index="$(tr -d '[:space:]' < .github/ramen-composition-index)"
          echo "COMPOSITION_INDEX=$index" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          pattern: '配卡结果-分片*'
          path: results
      - shell: bash
        run: |
          python3 - <<'PY' | tee "配卡${COMPOSITION_INDEX}-120地区组合报告.md"
          import csv, glob, os, collections
          index = int(os.environ['COMPOSITION_INDEX'])
          rows = []
          for p in glob.glob('results/**/composition-y3-matrix.csv', recursive=True):
              with open(p, encoding='utf-8', newline='') as f:
                  rows.extend(csv.DictReader(f))
          if len(rows) != 120:
              raise SystemExit(f'行数错误: {len(rows)}，期望 120')
          grouped = collections.defaultdict(list)
          for row in rows:
              grouped[(int(row['composition_index']), int(row['combo_index']))].append(row)
          expected = {(index, combo) for combo in range(120)}
          if set(grouped) != expected or any(len(v) != 1 for v in grouped.values()):
              raise SystemExit(f'配卡{index}的120个地区组合不完整')
          print(f'# 配卡{index}的120个拉面地区排列组合')
          print('\n- 本次只运行一种配卡。')
          print('- 分为2个Job，每个Job处理60个地区组合。')
          print('- 共运行120局。')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: 配卡${{ env.COMPOSITION_INDEX }}-120地区组合报告
          path: 配卡${{ env.COMPOSITION_INDEX }}-120地区组合报告.md
          retention-days: 30
