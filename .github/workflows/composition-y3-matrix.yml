name: 两配卡手写真实属性边际矩阵

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  matrix:
    name: ${{ matrix.build }}｜片${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        build: [3速1耐1智, 2速2耐1智]
        shard: [0, 1, 2, 3, 4]
    env:
      BUILD: ${{ matrix.build }}
      SHARD: ${{ matrix.shard }}
      RUNS: 20
      BASE_SEED: 939393
    steps:
      - uses: actions/checkout@v4
      - name: 登记程序
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('crates/umasim/Cargo.toml');s=p.read_text()
          block='''[[bin]]
          name = "focused_status_margin_matrix"
          path = "tools/data_collection/focused_status_margin_matrix.rs"

          '''
          if block not in s:s=s.replace('[features]',block+'[features]')
          p.write_text(s)
          PY
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: focused-status-margin
      - run: cargo check -p umasim --bin focused_status_margin_matrix --no-default-features
      - run: cargo run -p umasim --bin focused_status_margin_matrix --release --no-default-features
      - uses: actions/upload-artifact@v4
        with:
          name: 属性边际-${{ matrix.build }}-${{ matrix.shard }}
          path: focused-status-margin.csv
          retention-days: 30

  summary:
    name: 汇总手写属性边际矩阵
    needs: matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: 属性边际-*
          path: results
      - name: 生成报告
        run: |
          python3 - <<'PY' | tee 手写真实属性边际矩阵报告.md
          import csv,glob,statistics,collections
          rows=[]
          for p in glob.glob('results/**/focused-status-margin.csv',recursive=True):rows+=list(csv.DictReader(open(p)))
          builds=['3速1耐1智','2速2耐1智'];expected=2*100*25
          if len(rows)!=expected:raise SystemExit(f'期望{expected}行，实际{len(rows)}')
          def q(xs,p):
              x=sorted(xs);return x[round((len(x)-1)*p)]
          print('# 两配卡纯手写真实属性边际矩阵\n')
          print('- 每套配卡100个同种子样本；候选只改变训练的属性缺口奖励与近上限衰减。')
          print('- 恢复、外出、吃面、材料、地区和PT逻辑保持正式基线。\n')
          print('|配卡|排名|缺口|溢出|均分Δ|P10Δ|P50Δ|P90Δ|P95Δ|最高Δ|PTΔ|五维和Δ|速Δ|耐Δ|力Δ|根Δ|智Δ|胜/平/负|Y1面Δ|Y2面Δ|Y3面Δ|总面Δ|')
          print('|---|---:|---:|---:|---:|---:|---:|---:|---:|---:|---:|---:|---:|---:|---:|---:|---:|---|---:|---:|---:|---:|')
          for b in builds:
              base={int(r['run']):r for r in rows if r['build']==b and r['variant']=='baseline'};cand=collections.defaultdict(dict)
              for r in rows:
                  if r['build']==b and r['variant']=='margin':cand[(int(r['gap']),int(r['overflow']))][int(r['run'])]=r
              out=[]
              for key,rr in cand.items():
                  ids=sorted(base);d=[int(rr[i]['score'])-int(base[i]['score']) for i in ids];pt=[int(rr[i]['skill_pt'])-int(base[i]['skill_pt']) for i in ids];fs=[int(rr[i]['five_sum'])-int(base[i]['five_sum']) for i in ids];bs=[int(base[i]['score']) for i in ids];ns=[int(rr[i]['score']) for i in ids]
                  attrs=[statistics.mean(int(rr[i][k])-int(base[i][k]) for i in ids) for k in ['speed','stamina','power','guts','wisdom']]
                  eats=[statistics.mean(int(rr[i][k])-int(base[i][k]) for i in ids) for k in ['ramen_y1','ramen_y2','ramen_y3','ramen_total']]
                  out.append((statistics.mean(d),statistics.mean(pt),statistics.mean(fs),key,d,bs,ns,attrs,eats))
              out.sort(reverse=True)
              for rank,(md,mpt,mfs,(gap,over),d,bs,ns,a,e) in enumerate(out,1):
                  w=sum(x>0 for x in d);t=sum(x==0 for x in d);l=sum(x<0 for x in d)
                  print(f'|{b}|{rank}|{gap}%|{over}%|{md:+.1f}|{q(ns,.1)-q(bs,.1):+}|{q(ns,.5)-q(bs,.5):+}|{q(ns,.9)-q(bs,.9):+}|{q(ns,.95)-q(bs,.95):+}|{max(ns)-max(bs):+}|{mpt:+.1f}|{mfs:+.1f}|{a[0]:+.1f}|{a[1]:+.1f}|{a[2]:+.1f}|{a[3]:+.1f}|{a[4]:+.1f}|{w}/{t}/{l}|{e[0]:+.2f}|{e[1]:+.2f}|{e[2]:+.2f}|{e[3]:+.2f}|')
              promoted=[x for x in out if x[0]>0 and x[1]>0 and x[2]>0]
              print(f'\n**{b} 三项同时提升候选：{len(promoted)}/24。**\n')
              for label,key in [('基线','baseline'),('最佳候选',out[0][3])]:
                  rr=list(base.values()) if key=='baseline' else list(cand[key].values())
                  vals=[statistics.mean(int(r[k]) for r in rr) for k in ['ramen_y1','ramen_y2','ramen_y3','ramen_total']]
                  print(f'- {b} {label}平均吃面：Y1 {vals[0]:.2f} / Y2 {vals[1]:.2f} / Y3 {vals[2]:.2f} / 总计 {vals[3]:.2f}')
              print()
          PY
          cat 手写真实属性边际矩阵报告.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: 手写真实属性边际矩阵总报告
          path: 手写真实属性边际矩阵报告.md
          retention-days: 30
