name: 训练恢复统一终局搜索AB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ab:
    name: ${{ matrix.build }}｜${{ matrix.variant }}｜片${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        build: [3速1耐1智, 2速2耐1智]
        variant: [baseline, unified-search]
        shard: [0, 1, 2]
    env:
      BUILD: ${{ matrix.build }}
      VARIANT: ${{ matrix.variant }}
      SHARD: ${{ matrix.shard }}
      RUNS: 5
      SEARCH_N: 128
      BASE_SEED: 828282
    steps:
      - uses: actions/checkout@v4
      - name: 登记实验程序
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('crates/umasim/Cargo.toml');s=p.read_text()
          block='''[[bin]]
          name = "unified_train_search_ab"
          path = "tools/data_collection/unified_train_search_ab.rs"

          '''
          if block not in s:s=s.replace('[features]',block+'[features]')
          p.write_text(s)
          PY
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: unified-train-search-ab
      - name: 编译检查
        run: cargo check -p umasim --bin unified_train_search_ab --no-default-features
      - name: 运行AB
        run: cargo run -p umasim --bin unified_train_search_ab --release --no-default-features
      - uses: actions/upload-artifact@v4
        with:
          name: AB-${{ matrix.build }}-${{ matrix.variant }}-${{ matrix.shard }}
          path: unified-train-search-ab.csv
          retention-days: 30

  summary:
    name: 汇总统一搜索AB
    needs: ab
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: AB-*
          path: results
      - name: 汇总
        run: |
          python3 - <<'PY' | tee 训练恢复统一终局搜索AB报告.md
          import csv,glob,statistics
          rows=[]
          for p in glob.glob('results/**/unified-train-search-ab.csv',recursive=True):rows+=list(csv.DictReader(open(p)))
          builds=['3速1耐1智','2速2耐1智'];variants=['baseline','unified-search']
          if any(len([r for r in rows if r['build']==b and r['variant']==v])!=15 for b in builds for v in variants):
              raise SystemExit({(b,v):len([r for r in rows if r['build']==b and r['variant']==v]) for b in builds for v in variants})
          def pct(xs,p):
              x=sorted(xs);return x[round((len(x)-1)*p)]
          print('# 训练恢复统一终局搜索 AB\n')
          print('同一15个种子严格配对；统一搜索只接管Train阶段，在训练、休息、友人外出、普通外出、比赛等全部合法动作间以128次完整终局rollout的加权均值选择。其他阶段沿用正式策略。\n')
          print('|配卡|方案|均分|P10|P90|最高|PT|五维和|速|耐|力|根|智|搜索点/局|训练|休息|友人|普通外出|')
          print('|---|---|---:|---:|---:|---:|---:|---:|---:|---:|---:|---:|---:|---:|---:|---:|---:|---:|')
          for b in builds:
           for v in variants:
            rr=[r for r in rows if r['build']==b and r['variant']==v];m=lambda k:statistics.mean(float(r[k]) for r in rr);sc=[int(r['score']) for r in rr]
            print(f"|{b}|{v}|{m('score'):.1f}|{pct(sc,.1)}|{pct(sc,.9)}|{max(sc)}|{m('skill_pt'):.1f}|{m('five_sum'):.1f}|{m('speed'):.1f}|{m('stamina'):.1f}|{m('power'):.1f}|{m('guts'):.1f}|{m('wisdom'):.1f}|{m('searched'):.1f}|{m('train'):.1f}|{m('rest'):.1f}|{m('friend_outing'):.1f}|{m('normal_outing'):.1f}|")
          print('\n## 配对差值\n')
          print('|配卡|均分Δ|PTΔ|五维和Δ|胜/平/负|P10Δ|P90Δ|最高Δ|')
          print('|---|---:|---:|---:|---|---:|---:|---:|')
          for b in builds:
           base={int(r['run']):r for r in rows if r['build']==b and r['variant']=='baseline'};new={int(r['run']):r for r in rows if r['build']==b and r['variant']=='unified-search'}
           d=[int(new[i]['score'])-int(base[i]['score']) for i in sorted(base)];pt=[int(new[i]['skill_pt'])-int(base[i]['skill_pt']) for i in sorted(base)];fs=[int(new[i]['five_sum'])-int(base[i]['five_sum']) for i in sorted(base)];bs=[int(base[i]['score']) for i in sorted(base)];ns=[int(new[i]['score']) for i in sorted(base)]
           w=sum(x>0 for x in d);t=sum(x==0 for x in d);l=sum(x<0 for x in d)
           print(f'|{b}|{statistics.mean(d):+.1f}|{statistics.mean(pt):+.1f}|{statistics.mean(fs):+.1f}|{w}/{t}/{l}|{pct(ns,.1)-pct(bs,.1):+}|{pct(ns,.9)-pct(bs,.9):+}|{max(ns)-max(bs):+}|')
          print('\n说明：15局只用于验证结构方向和可达到的收益上界，不足以直接固化搜索为正式策略。若显著为正，再蒸馏高频分歧为低成本规则并做300局配对。')
          PY
          cat 训练恢复统一终局搜索AB报告.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: 训练恢复统一终局搜索AB总报告
          path: 训练恢复统一终局搜索AB报告.md
          retention-days: 30
