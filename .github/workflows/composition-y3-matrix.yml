name: 修复并验证吃面后必须训练

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-post-eat-training-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: 修复最佳训练索引未写回
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('crates/umasim/src/trainer/local_ramen_trainer.rs')
          s=p.read_text(encoding='utf-8')
          old='''            let _ = out
                .iter()
                .enumerate()
                .filter(|(i, _)| a.get(*i).is_some_and(|x| matches!(x.operation, Operation::Train(_))))
                .max_by(|(li, l), (ri, r)| l.score.total_cmp(&r.score).then_with(|| ri.cmp(li)))
                .map(|(i, _)| i)
                .ok_or_else(|| anyhow::anyhow!("已吃面但 Train 阶段没有训练候选"))?;'''
          new='''            guard = out
                .iter()
                .enumerate()
                .filter(|(i, _)| a.get(*i).is_some_and(|x| matches!(x.operation, Operation::Train(_))))
                .max_by(|(li, l), (ri, r)| l.score.total_cmp(&r.score).then_with(|| ri.cmp(li)))
                .map(|(i, _)| i)
                .ok_or_else(|| anyhow::anyhow!("已吃面但 Train 阶段没有训练候选"))?;'''
          if s.count(old)!=1: raise SystemExit(f'回归代码应命中1处，实际{s.count(old)}处')
          p.write_text(s.replace(old,new),encoding='utf-8')
          print('已恢复最佳训练索引写回 guard')
          PY
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: post-eat-training-regression
      - name: 编译及策略回归
        run: |
          cargo check -p umasim --no-default-features
          cargo test -p umasim recommended_ramen_uses_025_friend_pacing --no-default-features
      - name: 提交修复
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/umasim/src/trainer/local_ramen_trainer.rs
          git commit -m 'fix(ramen): enforce training after eating ramen'
          git push origin HEAD:${{ github.ref_name }}
