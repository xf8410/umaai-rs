name: P0第3步吃后体力转移初筛
on:
  push:
    branches: [workbench/skill-pt-matrix-distill]
    paths: ['.github/workflows/vital-transition-step3-v53.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  matrix:
    name: ${{ matrix.variant }}｜第${{ matrix.shard.human }}片
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        variant: [无转移预算, 训练后10轻罚, 训练后15轻罚, 训练后20轻罚, 训练后15中罚, 前20后10轻罚, 前30后15轻罚, 训练后硬底线0, 无恢复视野后15]
        shard:
          - {index: 0, human: 1}
          - {index: 1, human: 2}
          - {index: 2, human: 3}
    env:
      候选方案: ${{ matrix.variant }}
      基础种子: 602303
      分片序号: ${{ matrix.shard.index }}
      每分片局数: 100
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/ramen/add_vital_transition_override.py
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: {shared-key: 吃后体力转移}
      - run: cargo run -p umasim --bin vital_transition_matrix --release --features experiment-tools --no-default-features
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.variant }}-第${{ matrix.shard.human }}片
          path: 吃后体力转移矩阵.csv
          retention-days: 30
  summary:
    name: 汇总吃后体力转移初筛
    needs: matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: {pattern: '*-第*片', path: results}
      - run: |
          python3 - <<'PY' | tee 吃后体力转移初筛报告.md
          import csv,glob,collections,statistics
          g=collections.defaultdict(list)
          for p in glob.glob('results/**/吃后体力转移矩阵.csv',recursive=True):
            for r in csv.DictReader(open(p)): g[r['方案']].append(r)
          expected={'无转移预算','训练后10轻罚','训练后15轻罚','训练后20轻罚','训练后15中罚','前20后10轻罚','前30后15轻罚','训练后硬底线0','无恢复视野后15'}
          if set(g)!=expected or any(len(v)!=300 for v in g.values()): raise SystemExit({k:len(v) for k,v in g.items()})
          def st(rows,key):
            x=sorted(float(r[key]) for r in rows); return statistics.mean(x),x[29],x[0]
          print('# P0第3步：吃后体力转移初筛\n')
          print('> 固定3速1耐1智及第2步领先参数；只改变第三年吃面前后体力预算。\n')
          print('|方案|平均总分|分P10|最低分|平均PT|PT P10|最低PT|')
          print('|---|---:|---:|---:|---:|---:|---:|')
          out=[]
          for name,rows in g.items():
            s=st(rows,'总分'); p=st(rows,'技能点'); out.append((s[0],name,s,p))
          for _,name,s,p in sorted(out,reverse=True):
            print(f'|{name}|{s[0]:.1f}|{s[1]:.0f}|{s[2]:.0f}|{p[0]:.1f}|{p[1]:.0f}|{p[2]:.0f}|')
          print('\n下一轮从无预算、最佳软预算、无恢复视野、硬底线四类中选有行为差异者做结构诊断。')
          PY
          cat 吃后体力转移初筛报告.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: 吃后体力转移初筛报告
          path: 吃后体力转移初筛报告.md
          retention-days: 30
