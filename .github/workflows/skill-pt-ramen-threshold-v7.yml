name: Skill PT ramen threshold valuation v7

on:
  push:
    branches: [workbench/skill-pt-matrix-distill]
    paths: [.github/workflows/skill-pt-ramen-threshold-v7.yml]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  prep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check -p umasim --bin skill_pt_phase_matrix --no-default-features
      - name: Smoke test new threshold tokens
        env:
          VARIANT: smoke-threshold
          PT1: 16
          PT2: 64
          PT3: 64
          SAC: 140
          STRUCTURE: structall-ck25-rmj300-great600
          SHARD: 0
          RUNS_PER_SHARD: 0
        run: cargo run -p umasim --bin skill_pt_phase_matrix --no-default-features
      - run: |
          echo '# v7：拉面杯 scenario PT 跨档与 RMJ 阈值价值' >> "$GITHUB_STEP_SUMMARY"
          echo '固定 v6 胜出结构 structall；仅测试当年 scenario_pt 常驻档位、RMJ 达标线和第三年 5000 大成功线。' >> "$GITHUB_STEP_SUMMARY"

  threshold:
    needs: prep
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        variant:
          - {name: base, structure: structall}
          - {name: ck10, structure: structall-ck10}
          - {name: ck25, structure: structall-ck25}
          - {name: ck50, structure: structall-ck50}
          - {name: ck100, structure: structall-ck100}
          - {name: rmj100, structure: structall-rmj100}
          - {name: rmj300, structure: structall-rmj300}
          - {name: rmj600, structure: structall-rmj600}
          - {name: great300, structure: structall-great300}
          - {name: great600, structure: structall-great600}
          - {name: great1000, structure: structall-great1000}
          - {name: ck25-rmj300, structure: structall-ck25-rmj300}
          - {name: ck50-rmj300, structure: structall-ck50-rmj300}
          - {name: ck25-rmj600, structure: structall-ck25-rmj600}
          - {name: ck50-rmj600, structure: structall-ck50-rmj600}
          - {name: ck25-rmj300-great600, structure: structall-ck25-rmj300-great600}
          - {name: ck50-rmj300-great600, structure: structall-ck50-rmj300-great600}
          - {name: ck25-rmj600-great1000, structure: structall-ck25-rmj600-great1000}
        shard: [0, 1, 2]
    env:
      VARIANT: threshold-${{ matrix.variant.name }}
      PT1: 16
      PT2: 64
      PT3: 64
      SAC: 140
      STRUCTURE: ${{ matrix.variant.structure }}
      SHARD: ${{ matrix.shard }}
      RUNS_PER_SHARD: 50
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: skill-pt-matrix
      - run: cargo run -p umasim --bin skill_pt_phase_matrix --release --no-default-features
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v7-${{ env.VARIANT }}-shard${{ matrix.shard }}
          path: matrix-result.csv
          if-no-files-found: error
          retention-days: 7

  summary:
    if: always() && needs.threshold.result == 'success'
    needs: [prep, threshold]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workbench/skill-pt-matrix-distill
      - uses: actions/download-artifact@v4
        with:
          pattern: v7-*
          path: matrix-results
      - name: Generate persistent report
        env:
          REPORT_PATH: benchmark-results/skill-pt-ramen-threshold-v7-${{ github.run_id }}.md
        run: |
          python3 scripts/summarize_skill_pt_matrix.py
          cat "$REPORT_PATH" >> "$GITHUB_STEP_SUMMARY"
      - name: Commit report
        env:
          REPORT_PATH: benchmark-results/skill-pt-ramen-threshold-v7-${{ github.run_id }}.md
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$REPORT_PATH"
          git commit -m "bench: publish ramen threshold v7 run ${{ github.run_id }}"
          git push origin HEAD:workbench/skill-pt-matrix-distill
