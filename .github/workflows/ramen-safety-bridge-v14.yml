name: First-year ramen safety bridge v14
on:
  push:
    branches: [workbench/skill-pt-matrix-distill]
    paths: [.github/workflows/ramen-safety-bridge-v14.yml]
  workflow_dispatch:
permissions: {contents: write}
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: python3 scripts/patch_ramen_safety_bridge_v14.py
      - run: cargo fmt -- crates/umasim/src/trainer/local_ramen_trainer.rs
      - run: cargo check -p umasim --bin skill_pt_phase_matrix --no-default-features
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/umasim/src/trainer/local_ramen_trainer.rs
          git commit -m 'feat: add narrow first-year ramen safety bridge'
          git push origin HEAD:workbench/skill-pt-matrix-distill
  matrix:
    needs: patch
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        variant:
          - {name: raw-control, structure: structall-rpt200-window10-look0-samples1-rawfail}
          - {name: bridge8, structure: structall-rpt200-window10-look0-samples1-rawfail-bridge8-bgain5-bcost10}
          - {name: bridge10, structure: structall-rpt200-window10-look0-samples1-rawfail-bridge10-bgain5-bcost10}
          - {name: bridge12, structure: structall-rpt200-window10-look0-samples1-rawfail-bridge12-bgain10-bcost15}
        shard: [0, 1, 2]
    env:
      VARIANT: ${{ matrix.variant.name }}
      PT1: 16
      PT2: 64
      PT3: 64
      SAC: 140
      STRUCTURE: ${{ matrix.variant.structure }}
      SHARD: ${{ matrix.shard }}
      RUNS_PER_SHARD: 50
    steps:
      - uses: actions/checkout@v4
        with: {ref: workbench/skill-pt-matrix-distill}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: {shared-key: skill-pt-v14}
      - run: cargo run -p umasim --bin skill_pt_phase_matrix --release --no-default-features
      - uses: actions/upload-artifact@v4
        with:
          name: v14-${{ matrix.variant.name }}-shard${{ matrix.shard }}
          path: matrix-result.csv
          if-no-files-found: error
          retention-days: 7
  summary:
    needs: matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: workbench/skill-pt-matrix-distill}
      - uses: actions/download-artifact@v4
        with: {pattern: v14-*, path: matrix-results}
      - name: Generate report
        env: {REPORT_PATH: 'benchmark-results/ramen-safety-bridge-v14-${{ github.run_id }}.md'}
        run: |
          python3 scripts/summarize_skill_pt_matrix.py
          cat "$REPORT_PATH" >> "$GITHUB_STEP_SUMMARY"
      - name: Commit report
        env: {REPORT_PATH: 'benchmark-results/ramen-safety-bridge-v14-${{ github.run_id }}.md'}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$REPORT_PATH"
          git commit -m "bench: publish safety bridge v14 run ${{ github.run_id }}"
          git push origin HEAD:workbench/skill-pt-matrix-distill
