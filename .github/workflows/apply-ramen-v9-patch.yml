name: Apply generic ramen lookahead v9 patch
on:
  push:
    branches: [workbench/skill-pt-matrix-distill]
    paths: [.github/workflows/apply-ramen-v9-patch.yml]
permissions: {contents: write}
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/patch_ramen_lookahead_v9.py
      - run: cargo fmt -- crates/umasim/src/trainer/local_ramen_trainer.rs
      - run: cargo check -p umasim --bin skill_pt_phase_matrix --no-default-features
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/umasim/src/trainer/local_ramen_trainer.rs
          git commit -m 'feat: score every ramen by pre-decision best-action lookahead'
          git push origin HEAD:workbench/skill-pt-matrix-distill
