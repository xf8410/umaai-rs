name: Validate reorganized Ramen sources
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workbench/skill-pt-matrix-distill
          fetch-depth: 0
      - name: Add phase-specific matrix controls
        run: python3 scripts/ramen/add_phase_specific_structure_v36.py
      - uses: dtolnay/rust-toolchain@nightly
        with: {components: rustfmt}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: {shared-key: ramen-phase-v36}
      - name: Format with nightly only
        run: cargo +nightly fmt --all
      - name: Parser smoke test
        env:
          VARIANT: smoke
          PT1: 16
          PT2: 64
          PT3: 64
          SAC: 140
          STRUCTURE: structall-rpt200-window10-look0-samples1-rawfail-cook240-eatguard-friendrest-friendcap135-friendspecial4-specialdynamic
          STRUCTURE_Y1: vrest45
          STRUCTURE_Y2: vrest30
          STRUCTURE_Y3: vrest0
          RUNS_PER_SHARD: 0
        run: cargo run -p umasim --bin skill_pt_phase_matrix --no-default-features
      - name: Core tests
        run: cargo test -p umasim --lib --no-default-features
      - name: Workspace check
        run: cargo check --workspace
      - name: Commit validated support
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/umasim/tools/data_collection/skill_pt_phase_matrix.rs
          git commit -m 'feat(ramen): support phase-specific handwritten controls v36'
          git pull --rebase origin workbench/skill-pt-matrix-distill
          git push origin HEAD:workbench/skill-pt-matrix-distill
