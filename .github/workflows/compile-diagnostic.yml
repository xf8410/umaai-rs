name: Capture v7 compiler diagnostics
on:
  push:
    branches: [workbench/skill-pt-matrix-distill]
    paths: [.github/workflows/compile-diagnostic.yml]
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Capture compiler output
        run: |
          set +e
          cargo check -p umasim --bin skill_pt_phase_matrix --no-default-features > compile-v7.log 2>&1
          code=$?
          echo "exit_code=$code" >> compile-v7.log
          exit 0
      - name: Commit bounded diagnostics
        run: |
          tail -n 300 compile-v7.log > benchmark-results/compile-v7-diagnostic.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add benchmark-results/compile-v7-diagnostic.txt
          git commit -m 'ci: capture v7 compiler diagnostics'
          git push origin HEAD:workbench/skill-pt-matrix-distill
