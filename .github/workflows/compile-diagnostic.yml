name: Publish remove post-eat force v41 report
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: workbench/skill-pt-matrix-distill, fetch-depth: 0}
      - name: Download report
        env: {GH_TOKEN: '${{ github.token }}'}
        run: gh run download 32639945091 --repo xf8410/umaai-rs --name remove-post-eat-force-v41 --dir report
      - name: Validate and stage
        run: |
          test -s report/remove-post-eat-force-v41.md
          grep -q '平均总评分' report/remove-post-eat-force-v41.md
          mkdir -p .trae/exports
          cp report/remove-post-eat-force-v41.md .trae/exports/remove-post-eat-force-v41.md
      - name: Commit report
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .trae/exports/remove-post-eat-force-v41.md
          git commit -m 'docs(ramen): 记录 v41 吃面后强制训练消融' \
            -m '固化 300 局同种子对照的总评分、PT、属性评分、分位数与配对胜负；不修改正式策略。'
          git pull --rebase origin workbench/skill-pt-matrix-distill
          git push origin HEAD:workbench/skill-pt-matrix-distill
