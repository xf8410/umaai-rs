name: Ramen dynamic status balance matrix v39
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        variant:
          - control
          - gap50
          - overflow50
          - gap30-over30
          - gap50-over50
          - gap75-over50
          - gap100-over75
        shard: [0, 1, 2]
    env:
      VARIANT: ${{ matrix.variant }}
      SHARD: ${{ matrix.shard }}
      RUNS_PER_SHARD: 100
      PT1: 16
      PT2: 64
      PT3: 64
      SAC: 140
      STRUCTURE: structall-rpt200-window10-look0-samples1-rawfail-cook240-eatguard-friendrest-friendcap135-friendspecial4-specialdynamic
      STRUCTURE_Y1: vrest30
      STRUCTURE_Y2: vrest30
      STRUCTURE_Y3: vrest30
    steps:
      - uses: actions/checkout@v4
        with: {ref: workbench/skill-pt-matrix-distill}
      - name: Apply dynamic status balance experiment
        run: python3 scripts/ramen/add_dynamic_status_balance_v39.py
      - name: Select dynamic balance parameters
        shell: bash
        run: |
          case "${{ matrix.variant }}" in
            control)        ;;
            gap50)          echo 'STRUCTURE_Y3=statusdyn-gap50-over0-vrest30' >> "$GITHUB_ENV" ;;
            overflow50)     echo 'STRUCTURE_Y3=statusdyn-gap0-over50-vrest30' >> "$GITHUB_ENV" ;;
            gap30-over30)   echo 'STRUCTURE_Y3=statusdyn-gap30-over30-vrest30' >> "$GITHUB_ENV" ;;
            gap50-over50)   echo 'STRUCTURE_Y3=statusdyn-gap50-over50-vrest30' >> "$GITHUB_ENV" ;;
            gap75-over50)   echo 'STRUCTURE_Y3=statusdyn-gap75-over50-vrest30' >> "$GITHUB_ENV" ;;
            gap100-over75)  echo 'STRUCTURE_Y3=statusdyn-gap100-over75-vrest30' >> "$GITHUB_ENV" ;;
          esac
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: {shared-key: ramen-dynamic-status-v39}
      - name: Format and compile patched source
        run: |
          cargo fmt --all
          cargo check -p umasim --bin skill_pt_phase_matrix --no-default-features
      - name: Run paired 3-speed matrix
        run: cargo run -p umasim --bin skill_pt_phase_matrix --release --no-default-features
      - uses: actions/upload-artifact@v4
        with:
          name: v39-${{ matrix.variant }}-shard${{ matrix.shard }}
          path: matrix-result.csv
          if-no-files-found: error
          retention-days: 14
  summary:
    if: always()
    needs: matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: {pattern: v39-*, path: results}
      - name: Build joint score/PT/status report
        run: |
          python3 - <<'PY' | tee dynamic-status-balance-v39.md
          import csv,glob,collections,statistics
          d=collections.defaultdict(list)
          for p in glob.glob('results/**/matrix-result.csv',recursive=True):
            with open(p,newline='') as f:
              for r in csv.DictReader(f): d[r['variant']].append({k:int(r[k]) for k in ['b_score','b_skill_pt','b_status_score','b_status_sum']})
          if len(d)!=7 or any(len(x)!=300 for x in d.values()): raise SystemExit(f'incomplete: {[(k,len(v)) for k,v in d.items()]}')
          mean=lambda rs,k:statistics.mean(x[k] for x in rs)
          pct=lambda xs,p:sorted(xs)[round((len(xs)-1)*p)]
          b=d['control']; bs,bp,ba=mean(b,'b_score'),mean(b,'b_skill_pt'),mean(b,'b_status_score')
          print('# 3速卡组动态属性平衡矩阵 v39\n')
          print('> 每变体 300 局同种子；动态权重只在第三年启用。基线为 PT 16/64/64、sac140、体力门30/30/30。\n')
          print('|变体|平均分|Δ分|P10/P50/P90|平均PT|ΔPT|属性评分|Δ属性|五维和|联合提升|')
          print('|---|---:|---:|---:|---:|---:|---:|---:|---:|:---:|')
          for n,rs in sorted(d.items(),key=lambda z:mean(z[1],'b_score'),reverse=True):
            sc=[x['b_score'] for x in rs]; s,pt,a=mean(rs,'b_score'),mean(rs,'b_skill_pt'),mean(rs,'b_status_score')
            joint=s>bs and pt>bp and a>ba
            print(f'|{n}|{s:.1f}|{s-bs:+.1f}|{pct(sc,.1)}/{pct(sc,.5)}/{pct(sc,.9)}|{pt:.1f}|{pt-bp:+.1f}|{a:.1f}|{a-ba:+.1f}|{mean(rs,"b_status_sum"):.1f}|{"✅" if joint else "❌"}|')
          PY
          cat dynamic-status-balance-v39.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: dynamic-status-balance-v39-summary
          path: dynamic-status-balance-v39.md
          retention-days: 30
