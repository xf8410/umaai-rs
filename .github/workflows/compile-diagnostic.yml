name: Publish dynamic status balance v39 report
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: workbench/skill-pt-matrix-distill, fetch-depth: 0}
      - name: Download v39 report artifact
        env: {GH_TOKEN: '${{ github.token }}'}
        run: gh run download 32638251309 --repo xf8410/umaai-rs --name dynamic-status-balance-v39-summary --dir report
      - name: Validate and stage report
        run: |
          test -s report/dynamic-status-balance-v39.md
          test "$(grep -c '^|' report/dynamic-status-balance-v39.md)" -ge 9
          grep -q '联合提升' report/dynamic-status-balance-v39.md
          mkdir -p .trae/exports
          cp report/dynamic-status-balance-v39.md .trae/exports/dynamic-status-balance-v39.md
      - name: Commit durable report
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .trae/exports/dynamic-status-balance-v39.md
          git commit -m 'docs(ramen): 记录 v39 动态属性平衡矩阵' \
            -m '固化 run 32638251309 的 7 变体、每变体 300 局同种子结果，供分年份固定权重与动态权重交叉筛选。只保留数据事实，不修改正式策略。'
          git pull --rebase origin workbench/skill-pt-matrix-distill
          git push origin HEAD:workbench/skill-pt-matrix-distill
