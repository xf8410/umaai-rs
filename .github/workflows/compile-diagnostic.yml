name: Apply core-only test logger fix
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workbench/skill-pt-matrix-distill
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ramen-upstream-source-check
      - run: python3 scripts/fix_core_test_logger_cfg.py
      - run: cargo fmt --all
      - name: Compile and run core-only library tests
        run: cargo test -p umasim --lib --no-default-features
      - name: Validate default-feature workspace
        run: cargo check --workspace
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/umasim/src/utils.rs crates/umasim/src/output/turn_flow.rs
          git commit -m 'fix(test): support core-only library tests'
          git pull --rebase origin workbench/skill-pt-matrix-distill
          git push origin HEAD:workbench/skill-pt-matrix-distill
