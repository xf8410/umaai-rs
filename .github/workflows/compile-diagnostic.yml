name: Publish handwritten 8500 PT v37 report
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workbench/skill-pt-matrix-distill
          fetch-depth: 0
      - name: Download v37 matrix artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 32637324885 --repo xf8410/umaai-rs --pattern 'v37-*' --dir results
      - name: Build and validate report
        run: |
          mkdir -p .trae/exports
          python3 - <<'PY' | tee .trae/exports/handwritten-8500pt-v37.md
          import csv, glob, collections, statistics
          data=collections.defaultdict(list)
          for path in glob.glob('results/**/matrix-result.csv', recursive=True):
            with open(path, newline='') as f:
              for row in csv.DictReader(f):
                data[row['variant']].append({k:int(row[k]) for k in ['b_score','b_skill_pt','b_status_score']})
          expected={
            'baseline-16-64-64-s140','pt3-80-s140','pt3-96-s140','pt3-128-s140',
            'pt2-80-pt3-96-s140','pt2-96-pt3-128-s140',
            'pt2-80-pt3-96-s180','pt2-96-pt3-128-s180'
          }
          if set(data) != expected:
            raise SystemExit(f'variant mismatch: {sorted(data)}')
          if any(len(rows) != 300 for rows in data.values()):
            raise SystemExit(f'incomplete matrix: {[(name,len(rows)) for name,rows in data.items()]}')
          def mean(rows,key): return statistics.mean(r[key] for r in rows)
          def pct(values,p):
            values=sorted(values); return values[round((len(values)-1)*p)]
          base=data['baseline-16-64-64-s140']; base_score=mean(base,'b_score'); base_pt=mean(base,'b_skill_pt')
          print('# 手写策略 8500 PT 目标矩阵 v37\n')
          print('> 来源：[GitHub Actions run 32637324885](https://github.com/xf8410/umaai-rs/actions/runs/32637324885)')
          print('> 每变体 300 局；固定体力门 30/30/30，并使用相同 seed、马娘、卡组、继承及其余 v36 参数。\n')
          print('|变体|平均分|相对基线|P10/P50/P90|平均PT|PT差值|PT P10/P90|≥8500占比|属性评分|')
          print('|---|---:|---:|---:|---:|---:|---:|---:|---:|')
          rows_out=[]
          for name,rows in data.items():
            score=[r['b_score'] for r in rows]; pt=[r['b_skill_pt'] for r in rows]
            ms=statistics.mean(score); mp=statistics.mean(pt)
            rows_out.append((mp>=8500, mp, ms, name, score, pt, rows))
          for hit_target,mp,ms,name,score,pt,rows in sorted(rows_out, reverse=True):
            hit=sum(x>=8500 for x in pt)/len(pt)*100
            status=mean(rows,'b_status_score')
            print(f'|{name}|{ms:.1f}|{ms-base_score:+.1f}|{pct(score,.1)}/{pct(score,.5)}/{pct(score,.9)}|{mp:.1f}|{mp-base_pt:+.1f}|{pct(pt,.1)}/{pct(pt,.9)}|{hit:.1f}%|{status:.1f}|')
          PY
      - name: Commit report with descriptive evidence
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .trae/exports/handwritten-8500pt-v37.md
          git commit -m 'docs(ramen): 记录 v37 的 8500 PT 目标矩阵' \
            -m '以 v36 的 30/30/30 体力门为基线，比较第二、三年 PT 权重与 sac140/sac180，评估平均 8500 PT 目标及其评分代价。' \
            -m '- 8 个变体各包含 3 个 shard × 100 个相同 seed，共 2400 局；
          - 固定马娘、卡组、继承和其余策略结构；
          - 报告评分分位数、PT 分位数、8500 PT 命中率和属性评分；
          - 原始数据来自 Actions run 32637324885，提交前校验每个变体恰好 300 局。

          本提交仅固化实验事实，不修改 RecommendedRamenTrainer；后续参数提升将依据报告另行验证和提交。'
          git pull --rebase origin workbench/skill-pt-matrix-distill
          git push origin HEAD:workbench/skill-pt-matrix-distill
