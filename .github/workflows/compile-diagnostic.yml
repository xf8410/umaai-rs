name: Publish yearly dynamic status v40 report
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: workbench/skill-pt-matrix-distill, fetch-depth: 0}
      - name: Download v40 summary
        env: {GH_TOKEN: '${{ github.token }}'}
        run: gh run download 32638645128 --repo xf8410/umaai-rs --name yearly-dynamic-status-v40-summary --dir report
      - name: Validate report
        run: |
          test -s report/yearly-dynamic-status-v40.md
          test "$(grep -c '^|' report/yearly-dynamic-status-v40.md)" -ge 14
          grep -q '晋级' report/yearly-dynamic-status-v40.md
          mkdir -p .trae/exports
          cp report/yearly-dynamic-status-v40.md .trae/exports/yearly-dynamic-status-v40.md
      - name: Commit report
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .trae/exports/yearly-dynamic-status-v40.md
          git commit -m 'docs(ramen): 记录 v40 年度与动态权重交叉矩阵' \
            -m '固化 run 32638645128 的 12 个交叉变体、每变体 300 局同种子结果。报告联合比较总评分、PT、属性评分和 P10；本提交不修改正式策略。'
          git pull --rebase origin workbench/skill-pt-matrix-distill
          git push origin HEAD:workbench/skill-pt-matrix-distill
