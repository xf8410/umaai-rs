name: Publish friend cap v43 reports
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: workbench/skill-pt-matrix-distill, fetch-depth: 0}
      - name: Download reports
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          gh run download 32640666778 --repo xf8410/umaai-rs --name friend-cap-screen-v43 --dir report
          gh run download 32640666778 --repo xf8410/umaai-rs --name friend-cap-extremes-v43-summary --dir report
      - name: Stage
        run: |
          test -s report/friend-cap-screen-v43.md
          test -s report/friend-cap-extremes-v43.md
          mkdir -p .trae/exports
          cp report/friend-cap-screen-v43.md .trae/exports/
          cp report/friend-cap-extremes-v43.md .trae/exports/
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .trae/exports/friend-cap-*-v43.md
          git commit -m 'docs(ramen): 记录 v43 友人累计配额矩阵' \
            -m '固化 21 套配额各 300 局排序，以及初筛最高与最低的 1000 局同种子复赛。'
          git pull --rebase origin workbench/skill-pt-matrix-distill
          git push origin HEAD:workbench/skill-pt-matrix-distill
