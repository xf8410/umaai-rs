name: Validate reorganized Ramen sources
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with: {components: rustfmt}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: {shared-key: ramen-reorganized-source}
      - name: Nightly formatting check
        run: cargo +nightly fmt --all -- --check
      - name: Core-only tests
        run: cargo test -p umasim --lib --no-default-features
      - name: Default workspace check
        run: cargo check --workspace
