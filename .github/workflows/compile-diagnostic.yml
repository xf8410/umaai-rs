name: Ramen all 101 deck compositions screen v38
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      OUT: results/ramen-deck-compositions-v38.csv
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workbench/skill-pt-matrix-distill
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: {shared-key: ramen-deck-screen-v38}
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Screen all 101 compositions with 50 same seeds
        run: |
          mkdir -p results
          cargo run -p umasim --bin bench_compositions --release --no-default-features -- \
            --runs 50 --seed 61444 --trainer handwritten --friend 303054 --out "$OUT"
      - name: Build multi-objective report
        run: |
          python3 - <<'PY' | tee results/ramen-deck-compositions-v38.md
          import csv
          path='results/ramen-deck-compositions-v38.csv'
          rows=[]
          with open(path,newline='') as f:
            for r in csv.DictReader(f):
              x=dict(r)
              for k in ['completed','failed']:
                x[k]=int(x[k])
              for k in ['score_mean','score_median','score_p10','speed_mean','stamina_mean','power_mean','guts_mean','wisdom_mean','skill_pt_mean','rmj_all_rate','friend_all_rate']:
                x[k]=float(x[k])
              x['status_sum']=sum(x[k] for k in ['speed_mean','stamina_mean','power_mean','guts_mean','wisdom_mean'])
              rows.append(x)
          if len(rows)!=101 or any(r['completed']!=50 or r['failed']!=0 for r in rows):
            raise SystemExit(f'incomplete screen: rows={len(rows)}, bad={[(r["composition"],r["completed"],r["failed"]) for r in rows if r["completed"]!=50 or r["failed"]]}')
          score_min=min(r['score_mean'] for r in rows); score_span=max(r['score_mean'] for r in rows)-score_min or 1
          pt_min=min(r['skill_pt_mean'] for r in rows); pt_span=max(r['skill_pt_mean'] for r in rows)-pt_min or 1
          status_min=min(r['status_sum'] for r in rows); status_span=max(r['status_sum'] for r in rows)-status_min or 1
          p10_min=min(r['score_p10'] for r in rows); p10_span=max(r['score_p10'] for r in rows)-p10_min or 1
          for r in rows:
            # 总评分权重最高，同时要求 PT、五维与低分尾部均衡；仅用于筛选，不替代 300 局确认。
            r['joint']=.40*(r['score_mean']-score_min)/score_span + .20*(r['skill_pt_mean']-pt_min)/pt_span + .20*(r['status_sum']-status_min)/status_span + .20*(r['score_p10']-p10_min)/p10_span
          def table(title, selected):
            print(f'## {title}\n')
            print('|排名|构成|六卡 ID|平均分|P10|中位数|平均PT|五维均值和|RMJ全通|友人全出行|联合指标|')
            print('|---:|---|---|---:|---:|---:|---:|---:|---:|---:|---:|')
            for i,r in enumerate(selected,1):
              print(f'|{i}|{r["composition"]}|`{r["deck"]}`|{r["score_mean"]:.1f}|{r["score_p10"]:.1f}|{r["score_median"]:.1f}|{r["skill_pt_mean"]:.1f}|{r["status_sum"]:.1f}|{r["rmj_all_rate"]:.1%}|{r["friend_all_rate"]:.1%}|{r["joint"]:.4f}|')
            print()
          print('# 拉面杯全部 101 种支援卡构成筛选 v38\n')
          print('> 每种构成 50 个相同 seed，共 5050 局。第一阶段用于筛选；代表卡由确定性规则选择，不等于完整单卡强度排名。\n')
          table('按平均总评分前十', sorted(rows,key=lambda r:(r['score_mean'],r['score_p10']),reverse=True)[:10])
          table('按平均技能 PT 前十', sorted(rows,key=lambda r:(r['skill_pt_mean'],r['score_mean']),reverse=True)[:10])
          table('按总评分/PT/五维/P10联合指标前十', sorted(rows,key=lambda r:r['joint'],reverse=True)[:10])
          PY
          cat results/ramen-deck-compositions-v38.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: ramen-deck-compositions-v38
          path: |
            results/ramen-deck-compositions-v38.csv
            results/ramen-deck-compositions-v38.md
          if-no-files-found: error
          retention-days: 30
