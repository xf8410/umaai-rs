name: Publish v44 report
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: workbench/skill-pt-matrix-distill, fetch-depth: 0}
      - name: Download report
        env: {GH_TOKEN: '${{ github.token }}'}
        run: gh run download 32641458558 --repo xf8410/umaai-rs --name cap-and-cross-v44-summary --dir report
      - name: Commit report
        run: |
          test -s report/cap-and-cross-v44.md
          mkdir -p .trae/exports
          cp report/cap-and-cross-v44.md .trae/exports/
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .trae/exports/cap-and-cross-v44.md
          git commit -m 'docs(ramen): 记录 v44 配额与确定跨线矩阵' \
            -m '固化友人 1/3/5 对 0/2/5 的 1000 局确认，以及低体力确定跨 RMJ、5000、PT 效果阶梯的矩阵结果。'
          git pull --rebase origin workbench/skill-pt-matrix-distill
          git push origin HEAD:workbench/skill-pt-matrix-distill
