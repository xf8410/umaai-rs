name: Publish strict post-eat ablation v42 report
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: workbench/skill-pt-matrix-distill, fetch-depth: 0}
      - name: Download report
        env: {GH_TOKEN: '${{ github.token }}'}
        run: gh run download 32640258144 --repo xf8410/umaai-rs --name strict-post-eat-ablation-v42 --dir report
      - name: Validate and stage
        run: |
          test -s report/strict-post-eat-ablation-v42.md
          grep -q 'B 配对胜/平/负' report/strict-post-eat-ablation-v42.md
          mkdir -p .trae/exports
          cp report/strict-post-eat-ablation-v42.md .trae/exports/strict-post-eat-ablation-v42.md
      - name: Commit report
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .trae/exports/strict-post-eat-ablation-v42.md
          git commit -m 'docs(ramen): 记录 v42 严格吃面后硬门消融' \
            -m '固化 A/B 仅差 post_eat_force_training 的 300 局配对结果；v41 错误对照不用于结论。'
          git pull --rebase origin workbench/skill-pt-matrix-distill
          git push origin HEAD:workbench/skill-pt-matrix-distill
