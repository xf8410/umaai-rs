name: Ramen neural dimension cost matrix v31
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ramen-feature-schema-v31
  cancel-in-progress: true
jobs:
  dimension-cost:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: workbench/skill-pt-matrix-distill}
      - name: Calculate architecture cost matrix without training
        run: |
          mkdir -p benchmark-results
          python3 - <<'PY' > benchmark-results/ramen-neural-dimension-cost-v31.md
          dims=[192,256,384,512,768,1121]
          widths=[64,128,256,512]
          print('# 拉面杯神经网络维度成本矩阵 v31（不训练、不蒸馏）\n')
          print('> 仅比较全连接候选打分网络的静态成本；无教师标签、无拟合、无模型产物。此表不能判断决策质量。\n')
          print('|输入维度|隐藏宽度|参数量|FP32模型大小|单候选乘加量|32候选乘加量|')
          print('|---:|---:|---:|---:|---:|---:|')
          for d in dims:
            for h in widths:
              # 两层 MLP: d -> h -> h -> 1
              params=d*h+h + h*h+h + h+1
              mac=d*h+h*h+h
              print(f'|{d}|{h}|{params:,}|{params*4/1024/1024:.2f} MiB|{mac:,}|{mac*32:,}|')
          print('\n结构统一为 `input -> hidden -> hidden -> 1`。下一步若要判断“哪个好”，必须单独确认允许进行小样本训练矩阵；否则只能按延迟/大小选择。')
          PY
          cat benchmark-results/ramen-neural-dimension-cost-v31.md
      - name: Commit report
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add benchmark-results/ramen-neural-dimension-cost-v31.md
          git commit -m 'bench: publish neural dimension cost matrix v31'
          git pull --rebase origin workbench/skill-pt-matrix-distill
          git push origin HEAD:workbench/skill-pt-matrix-distill
