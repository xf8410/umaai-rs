name: 修复吃面后必须训练回归

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-post-eat-training-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: 恢复最佳训练索引写回并校验
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('crates/umasim/src/trainer/local_ramen_trainer.rs')
          text = path.read_text(encoding='utf-8')
          old = '''            let _ = out
                .iter()
                .enumerate()
                .filter(|(i, _)| a.get(*i).is_some_and(|x| matches!(x.operation, Operation::Train(_))))
                .max_by(|(li, l), (ri, r)| l.score.total_cmp(&r.score).then_with(|| ri.cmp(li)))
                .map(|(i, _)| i)
                .ok_or_else(|| anyhow::anyhow!("已吃面但 Train 阶段没有训练候选"))?;'''
          new = '''            guard = out
                .iter()
                .enumerate()
                .filter(|(i, _)| a.get(*i).is_some_and(|x| matches!(x.operation, Operation::Train(_))))
                .max_by(|(li, l), (ri, r)| l.score.total_cmp(&r.score).then_with(|| ri.cmp(li)))
                .map(|(i, _)| i)
                .ok_or_else(|| anyhow::anyhow!("已吃面但 Train 阶段没有训练候选"))?;'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'预期精确命中回归代码1处，实际{count}处')
          text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')

          fixed = path.read_text(encoding='utf-8')
          if old in fixed or new not in fixed:
              raise SystemExit('修复后源码校验失败')
          print('已恢复：吃面后硬门触发时，把五种训练中的最佳索引写回 guard')
          PY
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: post-eat-training-regression
      - name: 编译与相关回归测试
        run: |
          cargo check -p umasim --no-default-features
          cargo test -p umasim recommended_ramen_uses_025_friend_pacing --no-default-features
      - name: 提交修复到当前工作分支
        run: |
          if git diff --quiet; then
            echo '没有需要提交的变化'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/umasim/src/trainer/local_ramen_trainer.rs
          git commit -m 'fix(ramen): enforce training after eating ramen'
          git push origin HEAD:${{ github.ref_name }}
