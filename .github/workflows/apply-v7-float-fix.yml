name: Apply v7 float literal fix
on:
  push:
    branches: [workbench/skill-pt-matrix-distill]
    paths: [.github/workflows/apply-v7-float-fix.yml]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fix_v7_float_literals.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/umasim/src/trainer/local_ramen_trainer.rs
          git commit -m 'fix: use valid Rust float literals in v7 policy'
          git push origin HEAD:workbench/skill-pt-matrix-distill
