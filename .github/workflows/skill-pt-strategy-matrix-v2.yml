name: Skill PT paired strategy refinement v2
on:
  workflow_dispatch:
    inputs:
      runs_per_shard:
        description: Paired seeds per shard
        required: false
        default: '100'
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
jobs:
  matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        pt: [14, 16, 18, 20, 24, 28, 32]
        sac: [40, 60, 80, 100, 140, 200]
        shard: [0, 1, 2, 3]
    env:
      VARIANT: pt${{ matrix.pt }}-sac${{ matrix.sac }}-long-fail0
      SHARD: ${{ matrix.shard }}
      RUNS_PER_SHARD: ${{ inputs.runs_per_shard }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: {shared-key: skill-pt-matrix}
      - run: cargo run -p umasim --bin skill_pt_matrix --release --no-default-features
      - uses: actions/upload-artifact@v4
        with:
          name: v2-${{ env.VARIANT }}-shard${{ matrix.shard }}
          path: matrix-result.csv
          if-no-files-found: error
          retention-days: 7
  summary:
    if: always()
    needs: matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {pattern: v2-*, path: matrix-results}
      - name: Generate summary
        env:
          REPORT_PATH: skill-pt-matrix-v2.md
        run: python3 scripts/ramen/summarize_skill_pt_matrix.py && cat "$REPORT_PATH" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: skill-pt-refinement-v2-summary
          path: skill-pt-matrix-v2.md
          retention-days: 14
