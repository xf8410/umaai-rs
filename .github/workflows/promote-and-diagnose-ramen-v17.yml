name: Promote recommended ramen and diagnose low score v17
on:
  push:
    branches: [workbench/skill-pt-matrix-distill]
    paths: [.github/workflows/promote-and-diagnose-ramen-v17.yml]
  workflow_dispatch:
permissions: {contents: write}
jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: python3 scripts/promote_recommended_ramen_v17.py
      - run: cargo fmt -- crates/umasim/src/trainer/local_ramen_trainer.rs crates/umasim/src/trainer/mod.rs crates/umasim/src/search/searchable.rs crates/umasim/src/main.rs crates/umasim/src/bin/ramen_low_score_diagnostic.rs
      - run: cargo check -p umasim --bin skill_pt_phase_matrix --no-default-features
      - run: cargo check -p umasim --bin ramen_low_score_diagnostic --no-default-features
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/umasim/src/trainer/local_ramen_trainer.rs crates/umasim/src/trainer/mod.rs crates/umasim/src/search/searchable.rs crates/umasim/src/main.rs crates/umasim/src/bin/ramen_low_score_diagnostic.rs
          git commit -m 'feat: promote best ramen preset to production and rollout'
          git push origin HEAD:workbench/skill-pt-matrix-distill
  diagnose:
    needs: promote
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DIAG_RUNS: 150
      DIAG_OUTPUT_DIR: benchmark-results/low-score-v17-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: workbench/skill-pt-matrix-distill}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: {shared-key: ramen-low-score-v17}
      - run: cargo run -p umasim --bin ramen_low_score_diagnostic --release --no-default-features
      - name: Publish report
        run: cat "$DIAG_OUTPUT_DIR/lowest-report.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: ramen-low-score-v17-${{ github.run_id }}
          path: ${{ env.DIAG_OUTPUT_DIR }}
          if-no-files-found: error
          retention-days: 14
      - name: Commit diagnostic
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$DIAG_OUTPUT_DIR"
          git commit -m "bench: publish low-score diagnostic v17 run ${{ github.run_id }}"
          git push origin HEAD:workbench/skill-pt-matrix-distill
