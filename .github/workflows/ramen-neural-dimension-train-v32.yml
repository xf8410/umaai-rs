name: Ramen neural dimension training matrix v32
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ramen-neural-dimension-v32
  cancel-in-progress: false
jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - {shard: 0, start: 1000}
          - {shard: 1, start: 1150}
          - {shard: 2, start: 1300}
          - {shard: 3, start: 1450}
          - {shard: 4, start: 1600}
    env:
      START: ${{ matrix.start }}
      COUNT: 150
      ROLLOUTS: 32
    steps:
      - uses: actions/checkout@v4
        with: {ref: workbench/skill-pt-matrix-distill}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: {shared-key: ramen-neural-v32}
      - run: cargo fmt --all -- --check
      - run: cargo run -p umasim --bin ramen_feature_dataset --release --no-default-features
      - uses: actions/upload-artifact@v4
        with:
          name: ramen-neural-v32-${{ matrix.shard }}
          path: ramen-feature-dataset.jsonl
  train:
    needs: data
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: {ref: workbench/skill-pt-matrix-distill}
      - uses: actions/download-artifact@v4
        with: {pattern: ramen-neural-v32-*, path: data}
      - run: python3 -m pip install --user numpy
      - name: Train broad input-dimension and hidden-width matrix
        run: |
          mkdir -p benchmark-results
          python3 - <<'PY' > benchmark-results/ramen-neural-dimension-training-v32.md
          import glob,json,collections,math
          import numpy as np
          rows=[]
          for p in glob.glob('data/*/*.jsonl'):
            with open(p) as f: rows += [json.loads(x) for x in f if x.strip()]
          groups=collections.defaultdict(list)
          for i,r in enumerate(rows): groups[r['group']].append(i)
          gs=sorted(groups); val_groups=[g for g in gs if g%5==0]; train_groups=[g for g in gs if g%5!=0]
          train_idx=np.asarray([i for g in train_groups for i in groups[g]])
          y=np.asarray([r['teacher_mean'] for r in rows],dtype=np.float32)
          for ids in groups.values(): y[ids]=(y[ids]-y[ids].mean())/1000.0
          y=y[:,None]
          base=np.asarray([r['l'] for r in rows],dtype=np.float32)
          def expand_to(x,target):
            if x.shape[1]>=target:return x[:,:target]
            cols=[x]; need=target-x.shape[1]; d=x.shape[1]; made=0; lag=1
            # Deterministic explicit pair interactions. Unlike zero padding these add information
            # available to a linear/finite-width learner, while preserving reproducibility.
            while made<need:
              take=min(d,need-made); cols.append((x[:,:take]*np.roll(x,-lag,axis=1)[:,:take]).astype('f4'))
              made+=take; lag+=1
            return np.concatenate(cols,axis=1)[:,:target]
          schemas={
            'S161':np.asarray([r['s'] for r in rows],dtype=np.float32),
            'MID293':np.asarray([r['mid'] for r in rows],dtype=np.float32),
            'L398':base,
            'X768':expand_to(base,768),
            'X1121':expand_to(base,1121),
            'X1536':expand_to(base,1536),
          }
          print('# 拉面杯神经网络输入维度 × 隐藏宽度训练矩阵 v32\n')
          print(f'> {len(groups)} 个独立根局面（训练 {len(train_groups)} / 验证 {len(val_groups)}），每候选 32 次完整终局 rollout。此为架构实验训练，不导出生产模型、不接入策略。\n')
          print('> X768/X1121/X1536 由 L398 增加确定性的显式二阶交互项，不是补零；因此测试的是“更高维显式交互表示”而非凭空扩大向量。\n')
          print('|输入方案|输入维度|隐藏宽度|参数量|Top-1|平均后悔值|P90后悔值|相对分数MAE|')
          print('|---|---:|---:|---:|---:|---:|---:|---:|')
          for name,X0 in schemas.items():
            mu=X0[train_idx].mean(0); sd=X0[train_idx].std(0); sd[sd<1e-5]=1; X=(X0-mu)/sd
            for h in [64,128,256,512,1024]:
              rr=np.random.default_rng(320000+X.shape[1]*7+h)
              W1=rr.normal(0,math.sqrt(2/X.shape[1]),(X.shape[1],h)).astype('f4'); b1=np.zeros(h,'f4')
              W2=rr.normal(0,math.sqrt(2/h),(h,1)).astype('f4'); b2=np.zeros(1,'f4')
              lr=.0015; batch=512
              for epoch in range(70):
                order=rr.permutation(train_idx)
                for st in range(0,len(order),batch):
                  ix=order[st:st+batch]; xb=X[ix]; yb=y[ix]; z=xb@W1+b1; a=np.maximum(z,0); pred=a@W2+b2; d=2*(pred-yb)/len(ix)
                  gW2=a.T@d; gb2=d.sum(0); dz=(d@W2.T)*(z>0); gW1=xb.T@dz; gb1=dz.sum(0)
                  W1-=lr*np.clip(gW1,-5,5); b1-=lr*np.clip(gb1,-5,5); W2-=lr*np.clip(gW2,-5,5); b2-=lr*np.clip(gb2,-5,5)
                if epoch in (30,50):lr*=.3
              pred=(np.maximum(X@W1+b1,0)@W2+b2)[:,0]*1000
              regrets=[]; wins=0; maes=[]
              for g in val_groups:
                ids=groups[g]; truth=np.asarray([rows[i]['teacher_mean'] for i in ids]); pp=pred[ids]
                c=int(np.argmax(pp)); b=int(np.argmax(truth)); wins+=c==b; regrets.append(float(truth[b]-truth[c])); maes.extend(abs((truth-truth.mean())-pp))
              params=X.shape[1]*h+h+h+1
              print(f'|{name}|{X.shape[1]}|{h}|{params:,}|{wins/len(val_groups):.1%}|{np.mean(regrets):.1f}|{np.percentile(regrets,90):.1f}|{np.mean(maes):.1f}|')
          print('\n说明：本轮是单训练种子的宽筛。最终候选必须再做多训练种子确认，不能只凭单格最优值定型。')
          PY
          cat benchmark-results/ramen-neural-dimension-training-v32.md
      - name: Commit report
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add benchmark-results/ramen-neural-dimension-training-v32.md
          git commit -m 'bench: publish trained neural dimension matrix v32'
          git pull --rebase origin workbench/skill-pt-matrix-distill
          git push origin HEAD:workbench/skill-pt-matrix-distill
