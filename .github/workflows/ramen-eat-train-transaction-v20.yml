name: Ramen eat-then-train transaction v20
on:
  push:
    branches: [workbench/skill-pt-matrix-distill]
    paths: [.github/workflows/ramen-eat-train-transaction-v20.yml]
  workflow_dispatch:
permissions: {contents: write}
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: python3 scripts/fix_eat_then_train_v20.py
      - run: cargo fmt -- crates/umasim/src/trainer/local_ramen_trainer.rs
      - run: cargo check -p umasim --bin skill_pt_phase_matrix --no-default-features
      - run: cargo check -p umasim --bin ramen_low_score_diagnostic --no-default-features --features diag
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/umasim/src/trainer/local_ramen_trainer.rs
          if git diff --cached --quiet; then
            echo 'Patch already applied; nothing to commit.'
          else
            git commit -m 'fix: decide rest before eating and require training after ramen'
            git push origin HEAD:workbench/skill-pt-matrix-distill
          fi
  matrix:
    needs: patch
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        variant:
          - {name: old-split-decision, structure: structall-rpt200-window10-look0-samples1-rawfail-cook240-vrest30}
          - {name: eat-train-transaction, structure: structall-rpt200-window10-look0-samples1-rawfail-cook240-vrest30-eatguard}
        shard: [0, 1, 2]
    env:
      VARIANT: ${{ matrix.variant.name }}
      PT1: 16
      PT2: 64
      PT3: 64
      SAC: 140
      STRUCTURE: ${{ matrix.variant.structure }}
      SHARD: ${{ matrix.shard }}
      RUNS_PER_SHARD: 50
    steps:
      - uses: actions/checkout@v4
        with: {ref: workbench/skill-pt-matrix-distill}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: {shared-key: ramen-eat-train-v20}
      - run: cargo run -p umasim --bin skill_pt_phase_matrix --release --no-default-features
      - uses: actions/upload-artifact@v4
        with:
          name: v20-${{ matrix.variant.name }}-shard${{ matrix.shard }}
          path: matrix-result.csv
          retention-days: 14
  summary:
    needs: matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: workbench/skill-pt-matrix-distill}
      - uses: actions/download-artifact@v4
        with: {pattern: v20-*, path: matrix-results}
      - name: Generate report
        env: {REPORT_PATH: 'benchmark-results/ramen-eat-train-v20-${{ github.run_id }}.md'}
        run: |
          python3 scripts/summarize_skill_pt_matrix.py
          cat "$REPORT_PATH" >> "$GITHUB_STEP_SUMMARY"
      - name: Commit report
        env: {REPORT_PATH: 'benchmark-results/ramen-eat-train-v20-${{ github.run_id }}.md'}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$REPORT_PATH"
          git commit -m "bench: publish eat-train transaction v20 run ${{ github.run_id }}"
          git push origin HEAD:workbench/skill-pt-matrix-distill
  replay:
    needs: patch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DIAG_REPLAY_IDX: '131'
      RUST_LOG: info
    steps:
      - uses: actions/checkout@v4
        with: {ref: workbench/skill-pt-matrix-distill}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: {shared-key: ramen-eat-train-v20-replay}
      - name: Full in-game replay with pre-eat gate (expand this step)
        run: cargo run -p umasim --bin ramen_low_score_diagnostic --release --no-default-features --features diag
