name: Format committed Rust sources with nightly
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workbench/skill-pt-matrix-distill
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - name: Format with nightly only
        run: cargo +nightly fmt --all
      - name: Verify nightly formatting
        run: cargo +nightly fmt --all -- --check
      - name: Commit formatting only when needed
        run: |
          if git diff --quiet -- '*.rs'; then
            echo 'Rust sources already formatted.'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- '*.rs'
          git commit -m 'style: format committed Rust sources with nightly'
          git pull --rebase origin workbench/skill-pt-matrix-distill
          git push origin HEAD:workbench/skill-pt-matrix-distill
