name: G39配方续航严格消融
on:
  push:
    branches: [workbench/skill-pt-matrix-distill]
    paths: ['.github/workflows/g39-continuity-ablation-v61.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  ablation:
    name: ${{ matrix.variant }}｜种子${{ matrix.seed }}｜第${{ matrix.shard.human }}片
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        variant: [G39原续航, G39续航0]
        seed: [173205, 223606]
        shard:
          - {index: 0, human: 1}
          - {index: 1, human: 2}
          - {index: 2, human: 3}
    env:
      候选编号: ${{ matrix.variant }}
      基础种子: ${{ matrix.seed }}
      分片序号: ${{ matrix.shard.index }}
      每分片局数: 100
      Y1_PT: '31.0594'
      Y2_PT: '26.2536'
      Y3_PT: '4.3471'
      GAP: '1.1311'
      OVER: '1.3254'
      SAC: '234.9200'
      Y12_WINDOW: '0.1148'
      Y3_WINDOW: '0.1999'
      RESERVE: '5.2663'
      BOND: '5.2657'
      HINT: '11.2926'
    steps:
      - uses: actions/checkout@v4
      - name: 设置唯一消融变量
        run: |
          if [ "$候选编号" = 'G39原续航' ]; then echo 'CONTINUITY=3.0928' >> "$GITHUB_ENV"; else echo 'CONTINUITY=0.0000' >> "$GITHUB_ENV"; fi
      - name: 注入联合参数入口
        run: |
          python3 scripts/ramen/add_vital_transition_override.py
          python3 scripts/ramen/add_recipe_continuity_override.py
          python3 scripts/ramen/add_random_decimal_override.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('crates/umasim/Cargo.toml');s=p.read_text();mark='[features]'
          block='''[[bin]]
          name = "random_decimal_matrix"
          path = "tools/data_collection/random_decimal_matrix.rs"
          required-features = ["experiment-tools"]

          '''
          if block not in s:s=s.replace(mark,block+mark)
          p.write_text(s)
          PY
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: {shared-key: G39配方续航消融}
      - run: cargo run -p umasim --bin random_decimal_matrix --release --features experiment-tools --no-default-features
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.variant }}-种子${{ matrix.seed }}-第${{ matrix.shard.human }}片
          path: 随机小数权重矩阵.csv
          retention-days: 30
  summary:
    name: 汇总G39配方续航消融
    needs: ablation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: {pattern: 'G39*-种子*-第*片', path: results}
      - run: |
          python3 - <<'PY' | tee G39配方续航严格消融报告.md
          import csv,glob,collections,statistics
          g=collections.defaultdict(list);bs=collections.defaultdict(list)
          for p in glob.glob('results/**/随机小数权重矩阵.csv',recursive=True):
            for r in csv.DictReader(open(p)):g[r['候选']].append(r);bs[(r['候选'],r['基础种子'])].append(r)
          if set(g)!={'G39原续航','G39续航0'} or any(len(v)!=600 for v in g.values()):raise SystemExit({k:len(v) for k,v in g.items()})
          def st(rows,key):x=sorted(float(r[key]) for r in rows);return statistics.mean(x),x[59],x[0]
          print('# G39配方续航严格消融\n');print('|方案|平均总分|分P10|最低分|平均PT|PT P10|最低PT|种子A|种子B|')
          print('|---|---:|---:|---:|---:|---:|---:|---:|---:|');out={}
          for name,rows in g.items():
            s=st(rows,'总分');p=st(rows,'技能点');a=st(bs[(name,'173205')],'总分')[0];b=st(bs[(name,'223606')],'总分')[0];out[name]=(s,p,a,b)
            print(f'|{name}|{s[0]:.1f}|{s[1]:.0f}|{s[2]:.0f}|{p[0]:.1f}|{p[1]:.0f}|{p[2]:.0f}|{a:.1f}|{b:.1f}|')
          a=out['G39原续航'];z=out['G39续航0'];print(f'\n原续航相对0：均分 {a[0][0]-z[0][0]:+.1f}，P10 {a[0][1]-z[0][1]:+.0f}，平均PT {a[1][0]-z[1][0]:+.1f}。')
          print('\n该结果用于完成P0第4步归因；不把G39其余联合权重收益误记为配方续航收益。')
          PY
          cat G39配方续航严格消融报告.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: G39配方续航严格消融报告
          path: G39配方续航严格消融报告.md
          retention-days: 30
