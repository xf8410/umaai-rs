name: Skill PT structural v5 failmodel repair

on:
  push:
    branches: [workbench/skill-pt-matrix-distill]
    paths: [.github/workflows/skill-pt-structural-v5-repair.yml]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  prep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check -p umasim --bin skill_pt_phase_matrix --no-default-features
      - name: Smoke test failmodel parser through production binary
        env:
          VARIANT: smoke-failmodel
          PT1: 16
          PT2: 64
          PT3: 64
          SAC: 140
          STRUCTURE: failmodel
          SHARD: 0
          RUNS_PER_SHARD: 0
        run: cargo run -p umasim --bin skill_pt_phase_matrix --no-default-features
      - name: Smoke test combined failmodel parser
        env:
          VARIANT: smoke-vital-failmodel
          PT1: 64
          PT2: 80
          PT3: 96
          SAC: 200
          STRUCTURE: vital-failmodel
          SHARD: 0
          RUNS_PER_SHARD: 0
        run: cargo run -p umasim --bin skill_pt_phase_matrix --no-default-features

  repair:
    needs: prep
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 18
      matrix:
        variant:
          - {name: failmodel, structure: failmodel}
          - {name: vital-failmodel, structure: vital-failmodel}
          - {name: structall, structure: structall}
        profile:
          - {name: ptfocus, p1: 16, p2: 64, p3: 64, sac: 140}
          - {name: balanced, p1: 64, p2: 80, p3: 96, sac: 200}
        shard: [0, 1, 2]
    env:
      VARIANT: ${{ matrix.profile.name }}-${{ matrix.variant.name }}
      PT1: ${{ matrix.profile.p1 }}
      PT2: ${{ matrix.profile.p2 }}
      PT3: ${{ matrix.profile.p3 }}
      SAC: ${{ matrix.profile.sac }}
      STRUCTURE: ${{ matrix.variant.structure }}
      SHARD: ${{ matrix.shard }}
      RUNS_PER_SHARD: 50
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: skill-pt-matrix
      - run: cargo run -p umasim --bin skill_pt_phase_matrix --release --no-default-features
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v5-repair-${{ env.VARIANT }}-shard${{ matrix.shard }}
          path: matrix-result.csv
          if-no-files-found: error
          retention-days: 7

  summary:
    if: always() && needs.repair.result == 'success'
    needs: [prep, repair]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workbench/skill-pt-matrix-distill
      - uses: actions/download-artifact@v4
        with:
          pattern: v5-repair-*
          path: matrix-results
      - name: Generate repair report
        env:
          REPORT_PATH: benchmark-results/skill-pt-structural-v5-repair-${{ github.run_id }}.md
        run: |
          python3 scripts/summarize_skill_pt_matrix.py
          cat "$REPORT_PATH" >> "$GITHUB_STEP_SUMMARY"
      - name: Commit report
        env:
          REPORT_PATH: benchmark-results/skill-pt-structural-v5-repair-${{ github.run_id }}.md
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$REPORT_PATH"
          git commit -m "bench: publish v5 failmodel repair run ${{ github.run_id }}"
          git push origin HEAD:workbench/skill-pt-matrix-distill
