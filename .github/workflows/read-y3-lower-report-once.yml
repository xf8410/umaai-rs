name: 读取第三年PT下界报告
on:
  push:
    branches: [workbench/skill-pt-matrix-distill]
    paths: ['.github/workflows/read-y3-lower-report-once.yml']
permissions: {actions: read, contents: write}
jobs:
  read:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: workbench/skill-pt-matrix-distill}
      - uses: actions/download-artifact@v4
        with:
          name: 第三年PT下界双样本报告
          path: /tmp/report
          repository: xf8410/umaai-rs
          run-id: 32668019424
          github-token: ${{ github.token }}
      - run: |
          cp /tmp/report/第三年PT下界双样本报告.md .trae/exports/第三年PT下界双样本报告.md
          rm .github/workflows/read-y3-lower-report-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m '保存第三年PT下界双样本摘要'
          git push origin HEAD:workbench/skill-pt-matrix-distill
