name: Apply ramen timing v8 patch
on:
  push:
    branches: [workbench/skill-pt-matrix-distill]
    paths: [.github/workflows/apply-ramen-v8-patch.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/patch_ramen_timing_v8.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/umasim/src/trainer/local_ramen_trainer.rs
          git commit -m 'feat: add ramen timing and current training alignment valuation'
          git push origin HEAD:workbench/skill-pt-matrix-distill
