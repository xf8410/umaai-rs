name: Validate flat search cleanup
on:
  push:
    branches: ['workbench/validate-flat-search-cleanup']
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: flat-search-check-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - name: Check umasim all targets
        run: cargo check -p umasim --all-targets
