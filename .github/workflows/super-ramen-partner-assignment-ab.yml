name: Super ramen partner assignment paired A/B

on:
  push:
    branches: [workbench/skill-pt-matrix-distill]
    paths:
      - '.github/workflows/super-ramen-partner-assignment-ab.yml'
      - 'scripts/ramen/experiment_super_ramen_partner_assignment.py'
  workflow_dispatch:
    inputs:
      runs:
        description: Runs per player build and variant
        required: false
        default: '500'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  paired-ab:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      AB_RUNS: ${{ inputs.runs || '500' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: super-ramen-partner-assignment-ab

      - name: Library tests - current ramen mechanism
        shell: bash
        run: |
          set -o pipefail
          cargo test -p umasim --lib game::ramen -- --nocapture 2>&1 | tee ramen-library-baseline.log

      - name: Run current ramen score matrix
        run: cargo run -p umasim --bin bench_base --release --no-default-features -- --runs "$AB_RUNS" --seed 771400 --trainer handwritten --out benchmark-results/super-ramen-ab/baseline

      - name: Apply protocol-derived URAF candidate
        run: python3 scripts/ramen/experiment_super_ramen_partner_assignment.py

      - name: Library tests - candidate ramen mechanism
        shell: bash
        run: |
          set -o pipefail
          cargo test -p umasim --lib game::ramen -- --nocapture 2>&1 | tee ramen-library-candidate.log

      - name: Run candidate ramen score matrix with identical seeds
        run: cargo run -p umasim --bin bench_base --release --no-default-features -- --runs "$AB_RUNS" --seed 771400 --trainer handwritten --out benchmark-results/super-ramen-ab/candidate

      - name: Summarize paired score matrix
        run: |
          python3 - <<'PY'
          import csv, pathlib, statistics
          root = pathlib.Path('benchmark-results/super-ramen-ab')
          def load(name):
              with (root/name/'bench_base_results.csv').open() as f:
                  rows = list(csv.DictReader(f))
              return {(r['build'], r['seed']): r for r in rows}
          a, b = load('baseline'), load('candidate')
          keys = sorted(a.keys() & b.keys())
          if not keys or len(keys) != len(a) or len(keys) != len(b):
              raise SystemExit(f'unpaired results baseline={len(a)} candidate={len(b)} paired={len(keys)}')
          deltas = [int(b[k]['score']) - int(a[k]['score']) for k in keys]
          wins = sum(x > 0 for x in deltas); losses = sum(x < 0 for x in deltas)
          report = [
              '# 超级拉面额外人头协议修正 A/B', '',
              f'- 配对局数：{len(keys)}',
              f'- 候选平均分变化：{statistics.mean(deltas):+.2f}',
              f'- 中位变化：{statistics.median(deltas):+.2f}',
              f'- 候选胜/平/负：{wins}/{len(keys)-wins-losses}/{losses}', '',
              '| build | 局数 | 平均变化 | 胜/平/负 |', '|---|---:|---:|---:|'
          ]
          for build in sorted({k[0] for k in keys}):
              ds = [int(b[k]['score'])-int(a[k]['score']) for k in keys if k[0] == build]
              w=sum(x>0 for x in ds); l=sum(x<0 for x in ds)
              report.append(f'| {build} | {len(ds)} | {statistics.mean(ds):+.2f} | {w}/{len(ds)-w-l}/{l} |')
          keep = statistics.mean(deltas) > 0 and wins > losses
          report += ['', f'**判定：{"保留候选" if keep else "不保留候选"}**']
          text='\n'.join(report)+'\n'
          (root/'report.md').write_text(text)
          print(text)
          PY
          cat benchmark-results/super-ramen-ab/report.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: super-ramen-partner-assignment-ab-${{ github.run_id }}
          path: |
            benchmark-results/super-ramen-ab
            ramen-library-baseline.log
            ramen-library-candidate.log
          retention-days: 14
