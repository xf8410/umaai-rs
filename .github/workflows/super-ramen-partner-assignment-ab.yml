name: 超级拉面额外人头多权重矩阵

on:
  push:
    branches: [workbench/skill-pt-matrix-distill]
    paths:
      - '.github/workflows/super-ramen-partner-assignment-ab.yml'
      - 'scripts/ramen/experiment_super_ramen_partner_assignment.py'
  workflow_dispatch:
    inputs:
      runs_per_shard:
        description: 每个权重分片的模拟局数
        required: false
        default: '100'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  prepare:
    name: 准备并验证拉面杯机制
    runs-on: ubuntu-latest
    steps:
      - name: 读取仓库源码
        uses: actions/checkout@v4
      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
      - name: 恢复编译缓存
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: super-ramen-weight-matrix
      - name: 拉面杯当前机制库测试
        shell: bash
        run: |
          set -o pipefail
          cargo test -p umasim --lib game::ramen -- --nocapture 2>&1 | tee ramen-library-baseline.log
      - name: 临时应用协议确认的超级拉面人头修正
        run: python3 scripts/ramen/experiment_super_ramen_partner_assignment.py
      - name: 拉面杯候选机制库测试
        shell: bash
        run: |
          set -o pipefail
          cargo test -p umasim --lib game::ramen -- --nocapture 2>&1 | tee ramen-library-candidate.log
      - name: 上传机制测试日志
        uses: actions/upload-artifact@v4
        with:
          name: 拉面杯机制测试日志
          path: ramen-library-*.log
          retention-days: 14

  matrix:
    name: 权重-${{ matrix.weight }}-分片${{ matrix.shard }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 18
      matrix:
        weight:
          - 当前正式
          - 第二年偏低技能点
          - 第三年偏高技能点
          - 全程偏高技能点
          - 保守训练取舍
          - 激进训练取舍
        shard: [0, 1, 2]
    env:
      VARIANT: ${{ matrix.weight }}
      SHARD: ${{ matrix.shard }}
      RUNS_PER_SHARD: ${{ inputs.runs_per_shard || '100' }}
      STRUCTURE: structall-rpt200-window10-look0-samples1-rawfail-cook240-eatguard-friendrest-friendcap025-friendspecial4-specialdynamic
      STRUCTURE_Y1: vrest30
      STRUCTURE_Y2: vrest30
      STRUCTURE_Y3: vrest30
    steps:
      - name: 读取仓库源码
        uses: actions/checkout@v4
      - name: 设置本组权重
        shell: bash
        run: |
          case "${{ matrix.weight }}" in
            当前正式)             echo 'PT1=16' >> "$GITHUB_ENV"; echo 'PT2=64' >> "$GITHUB_ENV"; echo 'PT3=64' >> "$GITHUB_ENV"; echo 'SAC=140' >> "$GITHUB_ENV" ;;
            第二年偏低技能点)     echo 'PT1=16' >> "$GITHUB_ENV"; echo 'PT2=48' >> "$GITHUB_ENV"; echo 'PT3=64' >> "$GITHUB_ENV"; echo 'SAC=140' >> "$GITHUB_ENV" ;;
            第三年偏高技能点)     echo 'PT1=16' >> "$GITHUB_ENV"; echo 'PT2=64' >> "$GITHUB_ENV"; echo 'PT3=96' >> "$GITHUB_ENV"; echo 'SAC=140' >> "$GITHUB_ENV" ;;
            全程偏高技能点)       echo 'PT1=32' >> "$GITHUB_ENV"; echo 'PT2=80' >> "$GITHUB_ENV"; echo 'PT3=96' >> "$GITHUB_ENV"; echo 'SAC=140' >> "$GITHUB_ENV" ;;
            保守训练取舍)         echo 'PT1=16' >> "$GITHUB_ENV"; echo 'PT2=64' >> "$GITHUB_ENV"; echo 'PT3=64' >> "$GITHUB_ENV"; echo 'SAC=100' >> "$GITHUB_ENV" ;;
            激进训练取舍)         echo 'PT1=16' >> "$GITHUB_ENV"; echo 'PT2=64' >> "$GITHUB_ENV"; echo 'PT3=64' >> "$GITHUB_ENV"; echo 'SAC=180' >> "$GITHUB_ENV" ;;
          esac
      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
      - name: 恢复编译缓存
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: super-ramen-weight-matrix
      - name: 运行当前机制同种子分片
        run: |
          mkdir -p matrix-output
          cargo run -p umasim --bin skill_pt_phase_matrix --release --no-default-features
          mv matrix-result.csv matrix-output/current.csv
      - name: 临时应用协议确认的超级拉面人头修正
        run: python3 scripts/ramen/experiment_super_ramen_partner_assignment.py
      - name: 运行候选机制同种子分片
        run: |
          cargo run -p umasim --bin skill_pt_phase_matrix --release --no-default-features
          mv matrix-result.csv matrix-output/candidate.csv
      - name: 上传本组配对结果
        uses: actions/upload-artifact@v4
        with:
          name: 权重-${{ matrix.weight }}-分片${{ matrix.shard }}
          path: matrix-output
          retention-days: 14

  summary:
    name: 汇总全部权重与分片
    if: always()
    needs: [prepare, matrix]
    runs-on: ubuntu-latest
    steps:
      - name: 下载全部矩阵结果
        uses: actions/download-artifact@v4
        with:
          pattern: 权重-*
          path: results
      - name: 生成总评分对照表
        run: |
          python3 - <<'PY' | tee 超级拉面多权重矩阵报告.md
          import csv, glob, pathlib, statistics, collections
          grouped=collections.defaultdict(list)
          files=glob.glob('results/权重-*/matrix-output/current.csv')
          for current_path in files:
              base=pathlib.Path(current_path).parent
              candidate_path=base/'candidate.csv'
              with open(current_path,newline='') as f: current=list(csv.DictReader(f))
              with open(candidate_path,newline='') as f: candidate=list(csv.DictReader(f))
              if len(current)!=len(candidate): raise SystemExit(f'结果数量不一致：{base}')
              for a,b in zip(current,candidate):
                  if (a['variant'],a['shard'],a['run_idx']) != (b['variant'],b['shard'],b['run_idx']):
                      raise SystemExit(f'种子无法配对：{base}')
                  grouped[a['variant']].append({
                      'score':int(b['b_score'])-int(a['b_score']),
                      'pt':int(b['b_skill_pt'])-int(a['b_skill_pt']),
                      'status':int(b['b_status_score'])-int(a['b_status_score'])})
          if len(grouped)!=6: raise SystemExit(f'应有6组权重，实际{len(grouped)}组')
          print('# 超级拉面额外人头多权重同种子矩阵\n')
          print('| 权重方案 | 配对局数 | 平均总分变化 | 平均技能点变化 | 平均属性分变化 | 胜/平/负 |')
          print('|---|---:|---:|---:|---:|---:|')
          all_rows=[]
          for name,rows in grouped.items():
              ds=[r['score'] for r in rows]; w=sum(x>0 for x in ds); l=sum(x<0 for x in ds)
              print(f'| {name} | {len(rows)} | {statistics.mean(ds):+.1f} | {statistics.mean(r["pt"] for r in rows):+.1f} | {statistics.mean(r["status"] for r in rows):+.1f} | {w}/{len(ds)-w-l}/{l} |')
              all_rows.extend(rows)
          ds=[r['score'] for r in all_rows]; w=sum(x>0 for x in ds); l=sum(x<0 for x in ds)
          positive=sum(statistics.mean(r['score'] for r in rows)>0 for rows in grouped.values())
          print(f'\n总计 {len(all_rows)} 对；平均总分变化 {statistics.mean(ds):+.1f}；胜/平/负 {w}/{len(ds)-w-l}/{l}。')
          print(f'\n六组中有 {positive} 组平均分提高。')
          keep=positive>=4 and statistics.mean(ds)>0 and w>l
          print(f'\n**判定：{"保留候选" if keep else "不保留候选"}**')
          PY
          cat 超级拉面多权重矩阵报告.md >> "$GITHUB_STEP_SUMMARY"
      - name: 上传总报告
        uses: actions/upload-artifact@v4
        with:
          name: 超级拉面多权重矩阵总报告
          path: 超级拉面多权重矩阵报告.md
          retention-days: 30
