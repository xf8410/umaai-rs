name: Ramen upstream source check
on:
  push:
    branches: [ramen_workbench, 'workbench/**']
    paths:
      - 'crates/**/*.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'gamedata/scenario_ramen.json'
      - '.github/workflows/ramen-upstream-check.yml'
  pull_request:
    paths:
      - 'crates/**/*.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'gamedata/scenario_ramen.json'
  workflow_dispatch:
permissions:
  contents: read
env:
  SOURCE_SHA: ${{ github.sha }}
  SOURCE_REF: ${{ github.ref }}
  PATCH_LIST: ""
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify immutable experiment source
        run: python3 scripts/verify_experiment_source.py
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ramen-upstream-source-check
      - name: Rust formatting (nightly only)
        run: cargo +nightly fmt --all -- --check
      - name: Core compile without diagnostic logging
        run: cargo check --workspace --no-default-features
      - name: Core tests without diagnostic logging
        shell: bash
        run: |
          set -o pipefail
          cargo test -p umasim --lib --no-default-features -- --nocapture 2>&1 | tee upstream-test.log
      - name: Upload core test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upstream-core-test-log
          path: upstream-test.log
          if-no-files-found: warn
      - name: Default-feature compile
        run: cargo check --workspace
