name: Ramen upstream source check
on:
  push:
    branches: [workbench/skill-pt-matrix-distill]
    paths:
      - 'crates/**/*.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'gamedata/scenario_ramen.json'
      - '.github/workflows/ramen-upstream-check.yml'
  pull_request:
    paths:
      - 'crates/**/*.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'gamedata/scenario_ramen.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ramen-upstream-source-check
      - name: Reject source-generating experiment hooks
        run: |
          if grep -RInE 'python3 scripts/(patch_|fix_|restore_|promote_|friend_|y3_)' .github/workflows/ramen-upstream-check.yml; then
            echo 'upstream check must never rewrite Rust source' >&2
            exit 1
          fi
      - name: Rust formatting
        run: cargo fmt --all -- --check
      - name: Core compile without diagnostic logging
        run: cargo check --workspace --no-default-features
      - name: Core tests without diagnostic logging
        shell: bash
        run: |
          set -o pipefail
          cargo test -p umasim --lib --no-default-features -- --nocapture 2>&1 | tee upstream-test.log
      - name: Upload core test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upstream-core-test-log
          path: upstream-test.log
          if-no-files-found: warn
      - name: Default-feature compile
        run: cargo check --workspace
