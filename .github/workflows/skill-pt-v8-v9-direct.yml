name: Skill PT v8 vs v9 direct paired comparison
on:
  push:
    branches: [workbench/skill-pt-matrix-distill]
    paths: [.github/workflows/skill-pt-v8-v9-direct.yml]
  workflow_dispatch:
permissions:
  contents: write
env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
jobs:
  paired:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        strategy:
          # Frozen v8 implementation before generic lookahead replaced ramen_alignment.
          - {name: v8-align10, ref: 5882815b94d681d59e58ccf98ae0a7960e25a44c, structure: structall-rpt200-align10}
          # Current selected-three generic pre-decision lookahead implementation.
          - {name: v9-look50-s12, ref: workbench/skill-pt-matrix-distill, structure: structall-rpt200-look50-samples12}
        shard: [0, 1, 2]
    env:
      VARIANT: ${{ matrix.strategy.name }}
      PT1: 16
      PT2: 64
      PT3: 64
      SAC: 140
      STRUCTURE: ${{ matrix.strategy.structure }}
      SHARD: ${{ matrix.shard }}
      RUNS_PER_SHARD: 50
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ matrix.strategy.ref }}'}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: {shared-key: skill-pt-v8-v9-direct}
      - run: cargo run -p umasim --bin skill_pt_phase_matrix --release --no-default-features
      - uses: actions/upload-artifact@v4
        with:
          name: direct-${{ matrix.strategy.name }}-shard${{ matrix.shard }}
          path: matrix-result.csv
          if-no-files-found: error
          retention-days: 7
  summary:
    needs: paired
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: workbench/skill-pt-matrix-distill}
      - uses: actions/download-artifact@v4
        with: {pattern: direct-*, path: direct-results}
      - name: Direct paired summary
        env:
          REPORT: benchmark-results/skill-pt-v8-v9-direct-${{ github.run_id }}.md
        run: |
          python3 - <<'PY'
          import csv, glob, os, statistics
          rows={}
          for path in glob.glob('direct-results/**/matrix-result.csv',recursive=True):
              with open(path,newline='') as f:
                  for r in csv.DictReader(f):
                      rows.setdefault(r['variant'],{})[int(r['run_idx'])]=r
          a=rows['v8-align10']; b=rows['v9-look50-s12']; ids=sorted(set(a)&set(b))
          cols=[('skill_pt','b_skill_pt'),('status_score','b_status_score'),('status_sum','b_status_sum'),('final_score','b_score')]
          lines=['# v8 alignment 与 v9 selected-three lookahead 同 seed 直接配对','',f'- 配对局数：**{len(ids)}**',f'- v8：冻结提交 `5882815`，`structall-rpt200-align10`',f'- v9：当前分支，`structall-rpt200-look50-samples12`','', '|指标|v8均值|v9均值|v9-v8均值|差值中位数|v9胜率|','|---|---:|---:|---:|---:|---:|']
          for label,col in cols:
              av=[int(a[i][col]) for i in ids]; bv=[int(b[i][col]) for i in ids]; d=[y-x for x,y in zip(av,bv)]
              lines.append(f'|{label}|{statistics.mean(av):.1f}|{statistics.mean(bv):.1f}|{statistics.mean(d):+.1f}|{statistics.median(d):+.1f}|{sum(x>0 for x in d)/len(d):.1%}|')
          score_d=[int(b[i]['b_score'])-int(a[i]['b_score']) for i in ids]
          pt_d=[int(b[i]['b_skill_pt'])-int(a[i]['b_skill_pt']) for i in ids]
          status_d=[int(b[i]['b_status_score'])-int(a[i]['b_status_score']) for i in ids]
          lines += ['', '## 联合结果', '', f'- v9 最终评分更高：**{sum(x>0 for x in score_d)/len(ids):.1%}**', f'- v9 PT 更高且属性评分不降：**{sum(p>0 and s>=0 for p,s in zip(pt_d,status_d))/len(ids):.1%}**', f'- v9 PT 提高但属性评分下降：**{sum(p>0 and s<0 for p,s in zip(pt_d,status_d))/len(ids):.1%}**', '', '> 两边使用完全相同的 `run_idx`、基础 seed、马娘、卡组与继承；比较的是各自 B 策略结果，不再借助共同基准间接推断。']
          report=os.environ['REPORT']; os.makedirs(os.path.dirname(report),exist_ok=True)
          open(report,'w').write('\n'.join(lines)+'\n'); print('\n'.join(lines))
          PY
          cat "$REPORT" >> "$GITHUB_STEP_SUMMARY"
      - name: Commit report
        env:
          REPORT: benchmark-results/skill-pt-v8-v9-direct-${{ github.run_id }}.md
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$REPORT"
          git commit -m "bench: publish direct v8-v9 comparison run ${{ github.run_id }}"
          git push origin HEAD:workbench/skill-pt-matrix-distill
