name: Skill PT v8 vs v9 direct paired comparison
on:
  workflow_dispatch:
    inputs:
      runs_per_shard:
        description: Paired seeds per shard
        required: false
        default: '50'
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
jobs:
  paired:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        strategy:
          - {name: v8-align10, ref: 5882815b94d681d59e58ccf98ae0a7960e25a44c, structure: structall-rpt200-align10}
          - {name: v9-look50-s12, ref: workbench/skill-pt-matrix-distill, structure: structall-rpt200-look50-samples12}
        shard: [0, 1, 2]
    env:
      VARIANT: ${{ matrix.strategy.name }}
      PT1: 16
      PT2: 64
      PT3: 64
      SAC: 140
      STRUCTURE: ${{ matrix.strategy.structure }}
      SHARD: ${{ matrix.shard }}
      RUNS_PER_SHARD: ${{ inputs.runs_per_shard }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ matrix.strategy.ref }}'}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: {shared-key: skill-pt-v8-v9-direct}
      - run: cargo run -p umasim --bin skill_pt_phase_matrix --release --no-default-features
      - uses: actions/upload-artifact@v4
        with:
          name: direct-${{ matrix.strategy.name }}-shard${{ matrix.shard }}
          path: matrix-result.csv
          if-no-files-found: error
          retention-days: 7
  summary:
    needs: paired
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: {pattern: direct-*, path: direct-results}
      - name: Generate paired summary
        run: |
          python3 - <<'PY' | tee paired-comparison.md
          import csv, glob, statistics
          rows={}
          for path in glob.glob('direct-results/**/matrix-result.csv',recursive=True):
              with open(path,newline='') as f:
                  for r in csv.DictReader(f): rows.setdefault(r['variant'],{})[int(r['run_idx'])]=r
          a=rows['v8-align10']; b=rows['v9-look50-s12']; ids=sorted(set(a)&set(b))
          print('# v8 vs v9 same-seed paired comparison\n')
          print(f'- paired games: **{len(ids)}**\n')
          print('|metric|v8 mean|v9 mean|mean delta|median delta|v9 win rate|')
          print('|---|---:|---:|---:|---:|---:|')
          for label,col in [('skill_pt','b_skill_pt'),('status_score','b_status_score'),('status_sum','b_status_sum'),('final_score','b_score')]:
              av=[int(a[i][col]) for i in ids]; bv=[int(b[i][col]) for i in ids]; d=[y-x for x,y in zip(av,bv)]
              print(f'|{label}|{statistics.mean(av):.1f}|{statistics.mean(bv):.1f}|{statistics.mean(d):+.1f}|{statistics.median(d):+.1f}|{sum(x>0 for x in d)/len(d):.1%}|')
          PY
          cat paired-comparison.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: skill-pt-v8-v9-paired-summary
          path: paired-comparison.md
          retention-days: 14
