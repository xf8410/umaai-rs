name: Remove temporary cleanup script
on:
  push:
    branches: ['workbench/port-local-ramen-strategy']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Remove temporary script
        run: |
          git rm scripts/apply_flat_search_cleanup.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "chore: remove temporary cleanup script"
          git push
