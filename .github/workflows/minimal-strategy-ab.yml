name: Validate flat search warning cleanup
on:
  push:
    branches: ['workbench/port-local-ramen-strategy']
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: flat-search-cleanup-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - name: Check umasim all targets
        run: cargo check -p umasim --all-targets
      - name: Test umasim library
        run: cargo test -p umasim --lib
