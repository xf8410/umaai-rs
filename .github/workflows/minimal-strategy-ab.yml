name: Publish clean ramen strategy sources
on:
  push:
    branches: ['workbench/port-local-ramen-strategy']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Copy complete source set to clean branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin workbench/ramen-strategy-clean
          git checkout -B workbench/ramen-strategy-clean origin/workbench/ramen-strategy-clean
          for path in \
            crates/umasim/src/bin/minimal_strategy_ab.rs \
            crates/umasim/src/trainer/local_ramen_trainer.rs \
            crates/umasim/src/trainer/mod.rs \
            crates/umasim/src/search/flat_search.rs
          do
            mkdir -p "$(dirname "$path")"
            git show 8245fa4f7250700f13b9a7d5e8d4eae1972c32fa:"$path" > "$path"
          done
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/umasim/src
          if ! git diff --cached --quiet; then
            git commit -m "feat(ramen): complete paired A/B strategy sources"
            git push origin HEAD:workbench/ramen-strategy-clean
          fi
