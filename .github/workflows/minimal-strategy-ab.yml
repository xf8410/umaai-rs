name: Publish clean complete ramen strategy branch
on:
  push:
    branches: ['workbench/port-local-ramen-strategy']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Build clean strategy commit
        run: |
          set -euo pipefail
          git fetch origin workbench/ramen-strategy-clean
          git checkout workbench/ramen-strategy-clean
          for path in \
            .github/workflows/minimal-strategy-ab.yml \
            crates/umasim/src/bin/minimal_strategy_ab.rs \
            crates/umasim/src/trainer/local_ramen_trainer.rs \
            crates/umasim/src/trainer/mod.rs
          do
            mkdir -p "$(dirname "$path")"
            git show 8245fa4f7250700f13b9a7d5e8d4eae1972c32fa:"$path" > "$path"
          done
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            .github/workflows/minimal-strategy-ab.yml \
            crates/umasim/src/bin/minimal_strategy_ab.rs \
            crates/umasim/src/trainer/local_ramen_trainer.rs \
            crates/umasim/src/trainer/mod.rs
          git commit -m "feat(ramen): add guarded local strategy and paired A/B benchmark"
          git push origin HEAD:workbench/ramen-strategy-clean
