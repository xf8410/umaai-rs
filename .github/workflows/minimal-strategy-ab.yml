name: Minimal ramen strategy A/B

on:
  push:
    branches: ['workbench/port-local-ramen-strategy']
  workflow_dispatch:

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: minimal-strategy-ab-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - name: Run paired A/B (10 games per strategy)
        run: cargo run --quiet --release -p umasim --bin minimal_strategy_ab | tee minimal_strategy_ab.txt
      - name: Publish all 10 paired results
        run: |
          {
            echo '## 拉面策略最小 A/B'
            echo ''
            echo '- 同一卡组、同一继承、相同的 10 个 seed'
            echo '- 每个 seed 分别运行 upstream 和 local，共 20 局'
            echo ''
            echo '```text'
            cat minimal_strategy_ab.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: minimal-strategy-ab
          path: minimal_strategy_ab.txt
          if-no-files-found: error
