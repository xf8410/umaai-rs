name: Publish clean flat search cleanup branch
on:
  push:
    branches: ['workbench/port-local-ramen-strategy']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: workbench/flat-search-warning-cleanup
      - name: Apply cleanup
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('crates/umasim/src/search/flat_search.rs')
          s = p.read_text()
          s = s.replace('onsen::{OnsenTurnStage, action::OnsenAction, game::OnsenGame},', 'onsen::{action::OnsenAction, game::OnsenGame},')
          s = s.replace('max_depth={}, radical_factor={:.1}', 'max_depth={}, leaf_eval={}, radical_factor={:.1}')
          s = s.replace('            self.config.max_depth,\n            radical_factor,', '            self.config.max_depth,\n            self.leaf_evaluator.name(),\n            radical_factor,')
          start = s.index('/// 回合阶段编号（种子派生用）')
          end = s.index('#[cfg(feature = "onnx")]', start)
          s = s[:start] + s[end:]
          p.write_text(s)
          PY
      - name: Commit source-only change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/umasim/src/search/flat_search.rs
          git commit -m "chore(search): remove obsolete stage helper and log leaf evaluator"
          git push origin HEAD:workbench/flat-search-warning-cleanup
