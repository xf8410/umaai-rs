name: Minimal ramen strategy A/B

on:
  push:
    branches: ['workbench/port-local-ramen-strategy']
  workflow_dispatch:

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: minimal-strategy-ab-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - name: Run paired A/B
        shell: bash
        run: |
          set -o pipefail
          cargo run --quiet --release -p umasim --bin minimal_strategy_ab 2>&1 | tee minimal_strategy_ab.txt
      - name: Verify all paired results exist
        shell: bash
        run: |
          set -euo pipefail
          declared_runs="$(sed -n 's/^开始 A\/B：每套策略 \([0-9][0-9]*\) 局.*/\1/p' minimal_strategy_ab.txt)"
          test -n "$declared_runs"
          test "$(grep -c '^seed=' minimal_strategy_ab.txt)" -eq "$declared_runs"
          test "$(grep -c '^RESULT ' minimal_strategy_ab.txt)" -eq 2
          test "$(grep -c '^DELTA ' minimal_strategy_ab.txt)" -eq 1
      - name: Publish all paired results
        run: |
          {
            echo '## 拉面策略 A/B'
            echo ''
            echo '- 同一卡组、同一继承、相同 seed 的配对比较'
            echo '- A 为原上游手写策略，B 为本地修改策略'
            echo ''
            echo '```text'
            cat minimal_strategy_ab.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: minimal-strategy-ab
          path: minimal_strategy_ab.txt
          if-no-files-found: error
