name: Consolidated ramen strategy A/B
on:
  push:
    branches: ['workbench/ramen-strategy-consolidated']
  workflow_dispatch:
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ramen-ab-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - name: Test and run paired A/B
        shell: bash
        run: |
          set -euo pipefail
          cargo check -p umasim
          cargo run --quiet --release -p umasim --bin minimal_strategy_ab 2>&1 | tee minimal_strategy_ab.txt
      - name: Verify
        shell: bash
        run: |
          set -euo pipefail
          test "$(grep -c '^seed=' minimal_strategy_ab.txt)" -eq 1000
          test "$(grep -c '^RESULT ' minimal_strategy_ab.txt)" -eq 2
          test "$(grep -c '^PAIRED ' minimal_strategy_ab.txt)" -eq 1
          test "$(grep -c '^DELTA ' minimal_strategy_ab.txt)" -eq 1
          test -s logs/A_upstream_decisions.csv
          test -s logs/B_local_decisions.csv
          test -s logs/first_divergence.tsv
      - name: Summary
        run: |
          {
            echo '## Consolidated ramen strategy A/B'
            echo '```text'
            grep -E '^(RESULT|PAIRED|DELTA)' minimal_strategy_ab.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: ramen-ab-full-logs
          path: |
            minimal_strategy_ab.txt
            logs/A_upstream_decisions.csv
            logs/B_local_decisions.csv
            logs/first_divergence.tsv
          retention-days: 30
