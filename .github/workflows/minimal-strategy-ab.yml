name: Finalize flat search warning cleanup
on:
  push:
    branches: ['workbench/port-local-ramen-strategy']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Restore benchmark workflow and remove temporary script
        run: |
          git show 5ee20705eee649928698f9eb8f7a0df6244c95f2:.github/workflows/minimal-strategy-ab.yml > .github/workflows/minimal-strategy-ab.yml
          git rm scripts/apply_flat_search_cleanup.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/minimal-strategy-ab.yml
          git commit -m "ci: restore ramen A/B workflow after cleanup"
          git push
