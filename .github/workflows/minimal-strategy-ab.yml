name: Apply flat search warning cleanup
on:
  push:
    branches: ['workbench/port-local-ramen-strategy']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 5
      - name: Apply source cleanup
        run: python3 scripts/apply_flat_search_cleanup.py
      - name: Restore normal benchmark workflow
        run: git show 5ee20705eee649928698f9eb8f7a0df6244c95f2:.github/workflows/minimal-strategy-ab.yml > .github/workflows/minimal-strategy-ab.yml
      - name: Commit cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/umasim/src/search/flat_search.rs .github/workflows/minimal-strategy-ab.yml
          git rm scripts/apply_flat_search_cleanup.py
          git commit -m "chore(search): remove obsolete stage helper and log leaf evaluator"
          git push
